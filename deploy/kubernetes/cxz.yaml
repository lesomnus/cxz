# cxz on Kubernetes: one manager, and a pod with its own volume per project.
# See docs/kubernetes.md. Apply into a namespace of its own:
#
#   kubectl create namespace cxz
#   kubectl -n cxz create secret generic cxz-manager \
#     --from-literal=owner=$(openssl rand -hex 12) \
#     --from-literal=token=$(openssl rand -hex 32) \
#     --from-literal=web-token=$(openssl rand -hex 32) \
#     --from-literal=telemetry-password=$(openssl rand -hex 32)
#   kubectl -n cxz apply -f cxz.yaml
#
# The manager's permissions are this namespace's pods, their exec, volume
# claims and secrets: what it needs to run projects, and nothing outside.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxz-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxz-manager
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxz-manager
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cxz-manager}
subjects: [{kind: ServiceAccount, name: cxz-manager}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cxz-manager
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cxz-kubernetes
data:
  # How projects run. Each project may override image, user, storage and
  # resources when it is added. tools_image defaults to the manager's image.
  settings.json: |
    {
      "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
      "user": "vscode",
      "storage": "20Gi",
      "requests": {"cpu": "500m", "memory": "1Gi"},
      "limits": {"memory": "4Gi"}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxz-manager
spec:
  replicas: 1
  # The manager's databases are SQLite on one volume: one writer at a time.
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: cxz-manager}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cxz-manager}
    spec:
      serviceAccountName: cxz-manager
      securityContext: {fsGroup: 65532}
      containers:
        - name: manager
          image: ghcr.io/lesomnus/cxz:edge
          args: [--state, /var/lib/cxz, manager, serve]
          env:
            - {name: CXZ_BACKEND, value: kubernetes}
            - name: CXZ_OWNER
              valueFrom: {secretKeyRef: {name: cxz-manager, key: owner}}
            - name: CXZ_KUBERNETES
              valueFrom: {configMapKeyRef: {name: cxz-kubernetes, key: settings.json}}
            # The image a project's pod copies cxz from: the manager's own.
            - {name: CXZ_MANAGER_IMAGE, value: ghcr.io/lesomnus/cxz:edge}
            # Codex access tokens for brokered accounts, served to project pods
            # over the cluster network: each request carries a capability the
            # manager issued for that project and account.
            - {name: CXZ_BROKER_LISTEN, value: ":7351"}
            - {name: CXZ_BROKER_ADDRESS, value: "tcp://cxz-broker:7351"}
            # Usage telemetry: the database below, and the collector beside
            # this container, which project pods reach at cxz-telemetry.
            - {name: CXZ_TELEMETRY_DB_HOST, value: cxz-telemetry-db}
            - name: CXZ_TELEMETRY_PASSWORD
              valueFrom: {secretKeyRef: {name: cxz-manager, key: telemetry-password}}
            - {name: CXZ_TELEMETRY_LISTEN, value: "0.0.0.0:4317"}
            - {name: CXZ_TELEMETRY_HEALTH, value: "http://127.0.0.1:13133/"}
            - {name: CXZ_TELEMETRY_COLLECTOR, value: "tcp://cxz-telemetry:4317"}
          ports: [{name: broker, containerPort: 7351}]
          volumeMounts:
            - {name: state, mountPath: /var/lib/cxz}
            # The manager's own sockets and tools. Projects have their own.
            - {name: tools, mountPath: /cxz/tools}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
        # Clients reach the manager through its token relay: cxz --endpoint
        # tcp://NODE:30749 --token-file FILE. It is the manager's own socket,
        # on the same volume.
        - name: relay
          image: ghcr.io/lesomnus/cxz:edge
          args: [--state, /var/lib/cxz, expose, --listen, "tcp://0.0.0.0:7349", --token-file, /run/cxz/token]
          ports: [{name: relay, containerPort: 7349}]
          volumeMounts:
            - {name: state, mountPath: /var/lib/cxz}
            - {name: token, mountPath: /run/cxz, readOnly: true}
        # The usage collector. It reads the configuration and the project
        # registries the manager writes, and starts once the configuration is
        # there. Projects send to it over the cluster network, signed.
        - name: collector
          image: ghcr.io/lesomnus/cxz:edge
          command: [/bin/sh, -ec]
          args:
            - until [ -f /var/lib/cxz-telemetry/collector.yaml ]; do sleep 1; done; exec /usr/local/bin/cxz-otelcol --config=/var/lib/cxz-telemetry/collector.yaml
          ports: [{name: otlp, containerPort: 4317}]
          volumeMounts:
            - {name: state, subPath: telemetry, mountPath: /var/lib/cxz-telemetry}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
        # The browser UI. Its origin is a loopback address, which a browser
        # treats as secure without a certificate: reach it with
        #   kubectl -n cxz port-forward svc/cxz-web 7350
        # and open http://127.0.0.1:7350. For https, give it tls-cert and
        # tls-key from a Secret and an https origin instead.
        - name: web
          image: ghcr.io/lesomnus/cxz:edge
          args: [--state, /var/lib/cxz, -x, _web-serve, --listen, "0.0.0.0:7350", --origin, "http://127.0.0.1:7350", --access-token-file, /web/token]
          ports: [{name: web, containerPort: 7350}]
          volumeMounts:
            # Only the manager's sockets, read-only: no database, no projects.
            - {name: state, subPath: run, mountPath: /var/lib/cxz/run, readOnly: true}
            - {name: web-token, mountPath: /web, readOnly: true}
      volumes:
        - name: web-token
          secret: {secretName: cxz-manager, items: [{key: web-token, path: token}]}
        - name: state
          persistentVolumeClaim: {claimName: cxz-manager}
        - name: tools
          emptyDir: {}
        - name: token
          secret: {secretName: cxz-manager, items: [{key: token, path: token}]}
---
apiVersion: v1
kind: Service
metadata:
  name: cxz-manager
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: relay, port: 7349, targetPort: relay, nodePort: 30749}
---
# The browser UI is plaintext on a loopback origin: reach it through
# port-forward rather than exposing this port.
apiVersion: v1
kind: Service
metadata:
  name: cxz-web
spec:
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: web, port: 7350, targetPort: web}
---
# The token broker is for project pods only: not published on any node.
apiVersion: v1
kind: Service
metadata:
  name: cxz-broker
spec:
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: broker, port: 7351, targetPort: broker}
---
# Usage collector, for project pods only.
apiVersion: v1
kind: Service
metadata:
  name: cxz-telemetry
spec:
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: otlp, port: 4317, targetPort: otlp}
---
# The usage database: the same ClickHouse, and the same limits, as a Docker
# installation's. The manager creates its schema.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cxz-telemetry-db
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cxz-telemetry-db
data:
  cxz.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
      <logger><level>warning</level><console>true</console><log remove="1"/><errorlog remove="1"/></logger>
      <max_server_memory_usage>805306368</max_server_memory_usage>
      <max_connections>128</max_connections>
      <background_pool_size>16</background_pool_size>
      <background_move_pool_size>2</background_move_pool_size>
      <background_schedule_pool_size>4</background_schedule_pool_size>
      <background_message_broker_schedule_pool_size>2</background_message_broker_schedule_pool_size>
      <background_distributed_schedule_pool_size>2</background_distributed_schedule_pool_size>
      <mark_cache_size>33554432</mark_cache_size><uncompressed_cache_size>16777216</uncompressed_cache_size>
      <query_log remove="1"/><query_thread_log remove="1"/><query_views_log remove="1"/><query_metric_log remove="1"/>
      <part_log remove="1"/><trace_log remove="1"/><text_log remove="1"/><metric_log remove="1"/>
      <asynchronous_metric_log remove="1"/><asynchronous_insert_log remove="1"/><processors_profile_log remove="1"/>
      <error_log remove="1"/><crash_log remove="1"/><session_log remove="1"/><blob_storage_log remove="1"/>
      <backup_log remove="1"/><zookeeper_log remove="1"/><filesystem_cache_log remove="1"/>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxz-telemetry-db
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: cxz-telemetry-db}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cxz-telemetry-db}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.10.3.7-alpine@sha256:1b09f476eb1109522cfc0e8e4ddf6a4305263e7cdd310f7bd1d3fd29dfcb8b33
          env:
            - {name: CLICKHOUSE_USER, value: cxz}
            - {name: CLICKHOUSE_DB, value: telemetry}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: cxz-manager, key: telemetry-password}}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/cxz.xml, subPath: cxz.xml, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: cxz-telemetry-db}
        - name: config
          configMap: {name: cxz-telemetry-db}
---
apiVersion: v1
kind: Service
metadata:
  name: cxz-telemetry-db
spec:
  selector: {app.kubernetes.io/name: cxz-telemetry-db}
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
