apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxz-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxz-manager
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxz-manager
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cxz-manager}
subjects: [{kind: ServiceAccount, name: cxz-manager}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cxz-manager
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cxz-kubernetes
data:
  # How projects run. Each project may override image, user, storage and
  # resources when it is added. tools_image defaults to the manager's image.
  settings.json: |
    {
      "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
      "user": "vscode",
      "storage": "20Gi",
      "requests": {"cpu": "500m", "memory": "1Gi"},
      "limits": {"memory": "4Gi"}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxz-manager
spec:
  replicas: 1
  # The manager's databases are SQLite on one volume: one writer at a time.
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: cxz-manager}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cxz-manager}
    spec:
      serviceAccountName: cxz-manager
      securityContext: {fsGroup: 65532}
      containers:
        - name: manager
          image: ghcr.io/lesomnus/cxz:edge
          args: [--state, /var/lib/cxz, manager, serve]
          env:
            - {name: CXZ_BACKEND, value: kubernetes}
            - name: CXZ_OWNER
              valueFrom: {secretKeyRef: {name: cxz-manager, key: owner}}
            - name: CXZ_KUBERNETES
              valueFrom: {configMapKeyRef: {name: cxz-kubernetes, key: settings.json}}
            # Codex access tokens for brokered accounts, served to project pods
            # over the cluster network: each request carries a capability the
            # manager issued for that project and account.
            - {name: CXZ_BROKER_LISTEN, value: ":7351"}
            - {name: CXZ_BROKER_ADDRESS, value: "tcp://cxz-broker:7351"}
            # Usage telemetry: the database below, and the collector beside
            # this container, which project pods reach at cxz-telemetry.
            - name: CXZ_TELEMETRY_PASSWORD
              valueFrom: {secretKeyRef: {name: cxz-manager, key: telemetry-password}}
            - {name: CXZ_TELEMETRY_LISTEN, value: "0.0.0.0:4317"}
            - {name: CXZ_TELEMETRY_HEALTH, value: "http://127.0.0.1:13133/"}
            - {name: CXZ_TELEMETRY_COLLECTOR, value: "tcp://cxz-telemetry:4317"}
          # The usage database's connection: CXZ_TELEMETRY_DB_HOST, or
          # CXZ_TELEMETRY_DB_HTTP and CXZ_TELEMETRY_DB_NATIVE, with
          # CXZ_TELEMETRY_DB_USER and CXZ_TELEMETRY_DB_NAME. See the
          # cxz-telemetry ConfigMap.
          envFrom:
            - configMapRef: {name: cxz-telemetry}
          ports: [{name: broker, containerPort: 7351}]
          volumeMounts:
            - {name: state, mountPath: /var/lib/cxz}
            # The manager's own sockets and tools. Projects have their own.
            - {name: tools, mountPath: /cxz/tools}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
        # Clients reach the manager through its token relay: cxz --endpoint
        # tcp://NODE:30749 --token-file FILE. It is the manager's own socket,
        # on the same volume.
        - name: relay
          image: ghcr.io/lesomnus/cxz:edge
          args: [--state, /var/lib/cxz, expose, --listen, "tcp://0.0.0.0:7349", --token-file, /run/cxz/token]
          ports: [{name: relay, containerPort: 7349}]
          volumeMounts:
            - {name: state, mountPath: /var/lib/cxz}
            - {name: token, mountPath: /run/cxz, readOnly: true}
        # The usage collector. It reads the configuration and the project
        # registries the manager writes, and starts once the configuration is
        # there. Projects send to it over the cluster network, signed.
        - name: collector
          image: ghcr.io/lesomnus/cxz:edge
          command: [/bin/sh, -ec]
          args:
            - until [ -f /var/lib/cxz-telemetry/collector.yaml ]; do sleep 1; done; exec /usr/local/bin/cxz-otelcol --config=/var/lib/cxz-telemetry/collector.yaml
          ports: [{name: otlp, containerPort: 4317}]
          volumeMounts:
            - {name: state, subPath: telemetry, mountPath: /var/lib/cxz-telemetry}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
        # The browser UI. Its origin is a loopback address, which a browser
        # treats as secure without a certificate: reach it with
        #   kubectl -n NAMESPACE port-forward svc/cxz-web 7350
        # and open http://127.0.0.1:7350. For https on a DNS name, add the
        # ingress or the tls component (docs/kubernetes.md).
        - name: web
          image: ghcr.io/lesomnus/cxz:edge
          args: [--state, /var/lib/cxz, -x, _web-serve, --listen, "0.0.0.0:7350", --origin, "http://127.0.0.1:7350", --access-token-file, /web/token]
          ports: [{name: web, containerPort: 7350}]
          volumeMounts:
            # Only the manager's sockets, read-only: no database, no projects.
            - {name: state, subPath: run, mountPath: /var/lib/cxz/run, readOnly: true}
            - {name: web-token, mountPath: /web, readOnly: true}
      volumes:
        - name: web-token
          secret: {secretName: cxz-manager, items: [{key: web-token, path: token}]}
        - name: state
          persistentVolumeClaim: {claimName: cxz-manager}
        - name: tools
          emptyDir: {}
        - name: token
          secret: {secretName: cxz-manager, items: [{key: token, path: token}]}
---
apiVersion: v1
kind: Service
metadata:
  name: cxz-manager
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: relay, port: 7349, targetPort: relay, nodePort: 30749}
---
# The browser UI is plaintext on a loopback origin: reach it through
# port-forward rather than exposing this port.
apiVersion: v1
kind: Service
metadata:
  name: cxz-web
spec:
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: web, port: 7350, targetPort: web}
---
# The token broker is for project pods only: not published on any node.
apiVersion: v1
kind: Service
metadata:
  name: cxz-broker
spec:
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: broker, port: 7351, targetPort: broker}
---
# Usage collector, for project pods only.
apiVersion: v1
kind: Service
metadata:
  name: cxz-telemetry
spec:
  selector: {app.kubernetes.io/name: cxz-manager}
  ports:
    - {name: otlp, port: 4317, targetPort: otlp}
---
# Where usage is stored: a ClickHouse server, possibly shared by many
# installations, on which this one has its own account and database. The
# password is the cxz-manager Secret's telemetry-password. An overlay sets
# these; components/clickhouse runs a server of the installation's own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cxz-telemetry
data:
  CXZ_TELEMETRY_DB_HTTP: "http://clickhouse.example:8123"
  CXZ_TELEMETRY_DB_NATIVE: "tcp://clickhouse.example:9000"
  CXZ_TELEMETRY_DB_USER: "cxz"
  CXZ_TELEMETRY_DB_NAME: "telemetry"
