name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: CXZ_TEST_RACE=1 go test -race ./... -count=1
      - name: Build versioned binaries and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare multi-platform image context
        run: |
          sed 's|COPY cxz /usr/local/bin/cxz|ARG TARGETARCH\nCOPY linux-${TARGETARCH}/cxz /usr/local/bin/cxz|' internal/installer/image.Dockerfile > dist/Dockerfile
      - name: Publish versioned manager image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" > dist/manager-image.txt
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" --verify-tag --generate-notes "${args[@]}" dist/*.tar.gz dist/SHA256SUMS dist/manager-image.txt
