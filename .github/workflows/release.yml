name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/releases/**']
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: CXZ_TEST_RACE=1 go test -race ./... -count=1
      - name: Build versioned binaries and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned manager image
        id: image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        env:
          REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ github.ref_name }}
          BUILD_HASH: ${{ github.sha }}
        with:
          source: .
          targets: app
          push: true
          set: app.tags=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_METADATA: ${{ steps.image.outputs.metadata }}
        run: |
          IMAGE_DIGEST=$(jq -er '.app["containerimage.digest"]' <<< "$IMAGE_METADATA")
          printf '%s\n' "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" > dist/manager-image.txt
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" --verify-tag --generate-notes "${args[@]}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/manager-image.txt
  notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Sync reviewed notes for published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in docs/releases/v*.md; do
            test -f "$file" || continue
            version=$(basename "$file" .md)
            gh release edit "$version" --notes-file "$file"
          done
