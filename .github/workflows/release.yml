name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/releases/**']
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: CXZ_TEST_RACE=1 go test -race ./... -count=1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Build versioned binaries and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned manager image
        id: image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ github.ref_name }}
          BUILD_HASH: ${{ github.sha }}
        with:
          source: .
          targets: app
          push: true
          set: app.tags=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_METADATA: ${{ steps.image.outputs.metadata }}
        run: |
          IMAGE_DIGEST=$(jq -er '.app["containerimage.digest"]' <<< "$IMAGE_METADATA")
          printf '%s\n' "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" > dist/manager-image.txt
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          if test -f "docs/releases/$RELEASE_VERSION.md"; then args+=(--notes-file "docs/releases/$RELEASE_VERSION.md"); else args+=(--generate-notes); fi
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/manager-image.txt)
          if [[ "$RELEASE_VERSION" != *-* ]]; then
            python3 scripts/update-manifest.py dist "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" "$RELEASE_VERSION"
            assets+=(dist/cxz-update.json dist/auto-update/*)
          fi
          gh release create "$RELEASE_VERSION" --draft --verify-tag "${args[@]}" "${assets[@]}"
          # Stable discovery must never observe a release with missing assets.
          gh release edit "$RELEASE_VERSION" --draft=false
  notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync reviewed notes for published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in docs/releases/v*.md; do
            test -f "$file" || continue
            version=$(basename "$file" .md)
            gh release view "$version" >/dev/null 2>&1 || continue
            gh release edit "$version" --notes-file "$file"
          done
