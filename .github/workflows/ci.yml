name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: cxz-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-frontend:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./cmd/cxz ./internal/transport
      - run: go build -o cxz.exe ./cmd/cxz
      - run: .\cxz.exe version
      - run: .\cxz.exe terminal-info --plain
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: CXZ_TEST_RACE=1 go test -race ./... -count=1
      - run: go run ./tools/genproto && git diff --exit-code -- api
      - run: go tool pd gen --check .
      - run: bash scripts/release.sh v0.0.0-ci
      - run: dist/linux-amd64/cxz version
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository }}
      TAG: edge
      APP_VERSION: edge
      BUILD_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Bake binaries
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          targets: build
          set: |
            build.cache-from=type=gha,scope=cxz-build
            build.cache-to=type=gha,scope=cxz-build,mode=max
      - name: Check native binary
        run: dist/linux-amd64/cxz version
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake manager image (publish only main pushes)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          targets: app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          set: |
            app.cache-from=type=gha,scope=cxz-app
            app.cache-to=type=gha,scope=cxz-app,mode=max
