name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
permissions:
  contents: read
concurrency:
  group: cxz-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Cancel superseded PR checks; main validation runs independently.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What this change can possibly break, so the suites that cannot see it do not
  # set the pace. A Go change to the update machinery waited eleven minutes for
  # the browser sandbox and for Storybook, twice -- once on the pull request and
  # again on main before the release could be published -- which is most of the
  # cost of testing whether an installation updates at all.
  #
  # Storybook never touches Go. The sandbox is the UI against a js/wasm build of
  # `./cmd/cxz-sandbox`, so it is asked precisely: the dependency set of that
  # build for that platform, against the packages this change touches. Guessing
  # instead of asking would have skipped the suite that caught `internal/
  # eventview` breaking the wasm build. See cxz#253.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      storybook: ${{ steps.scope.outputs.storybook }}
      sandbox: ${{ steps.scope.outputs.sandbox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          everything() {
            printf 'storybook=true\nsandbox=true\n' >> "$GITHUB_OUTPUT"
            echo "scope: everything ($1)"
            exit 0
          }
          # Having no base to compare against is not an invitation to skip.
          case "$BASE" in
            "" | 0000000000000000000000000000000000000000) everything "no base revision" ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || everything "base revision unavailable"
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files" | sed 's/^/changed: /'
          if printf '%s\n' "$files" | grep -qE '^(ts/|packages/|proto/|\.github/|go\.mod$|go\.sum$)'; then
            everything "web sources, protos, submodule or workflow"
          fi
          sandbox=false
          GOOS=js GOARCH=wasm go list -deps ./cmd/cxz-sandbox \
            | sed -n 's|^github.com/lesomnus/cxz/\{0,1\}||p' | sort -u > /tmp/wasm-packages
          for f in $(printf '%s\n' "$files" | grep -E '\.go$' || true); do
            d=$(dirname "$f")
            [ "$d" = "." ] && d=""
            if grep -qxF -- "$d" /tmp/wasm-packages; then
              sandbox=true
              echo "scope: $f is in the sandbox's wasm build"
              break
            fi
          done
          printf 'storybook=false\nsandbox=%s\n' "$sandbox" >> "$GITHUB_OUTPUT"
          echo "scope: storybook=false sandbox=$sandbox"
  # Three jobs rather than one, because this was nineteen minutes of suites
  # running one after another on a single runner. Each suite is wall-clock bound
  # -- it waits for real motion, which is why `workers: 1` stays -- so the only
  # way to spend less time is to wait in parallel. Measured: sandbox 523s,
  # storybook 313s, everything else 88s, so the split is drawn there and the
  # longest job sets the pace. Each job repeats checkout, npm ci and the browser
  # download, about ninety seconds, which is cheaper than passing builds between
  # them as artifacts.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts
      - run: go tool pd gen --check --ts .
      - run: npm run --prefix ts build
      - run: test -z "$(git status --porcelain -- ts/gen)"
      - run: npm run --prefix ts test
      - run: npx playwright install --with-deps chromium
        working-directory: ts
      - run: npm run --prefix ts test:nox:live
      - run: npm run --prefix ts test:performance
      - run: npm run --prefix ts test:browser
      - run: npm run --prefix ts test:browser:plaintext
      # The dev server, which until now nothing ran. The one thing it does
      # differently is resolve the nox submodule as source, and that is the one
      # thing that broke. See cxz#232.
      - run: npm run --prefix ts test:browser:dev
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-results
          path: ts/test-results/
          if-no-files-found: ignore
          retention-days: 7
  # Storybook serves its own static build, so this needs no Go.
  web-storybook:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts
      - run: npx playwright install --with-deps chromium
        working-directory: ts
      - run: npm run --prefix ts build-storybook:ui
      - run: npm run --prefix ts test:ui
      - run: npm run --prefix ts build-storybook
      - run: npm run --prefix ts test:storybook
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-storybook-test-results
          path: ts/test-results/
          if-no-files-found: ignore
          retention-days: 7
  # The sandbox is the UI against a WASM build of the server, so this one does
  # need Go. It is the longest suite and sets this workflow's wall clock: it
  # lands around nine minutes and has been cancelled at fifteen, so the ceiling
  # is where a job that is actually stuck gets stopped, not where a busy runner
  # does.
  web-sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts
      - run: npx playwright install --with-deps chromium
        working-directory: ts
      - run: npm run --prefix ts sandbox:build
      - run: npm run --prefix ts test:sandbox
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-sandbox-test-results
          path: ts/test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows-frontend:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: go test ./cmd/cxz ./internal/transport ./internal/core ./internal/settings ./internal/selfupdate ./internal/cxzupdate ./internal/versionpin
      - run: go test ./internal/tui -run TestWindows -count=1
      - run: go build -o cxz.exe ./cmd/cxz
      - run: .\cxz.exe version
      - run: .\cxz.exe terminal-info --plain
      - name: Install the Windows frontend and register its Terminal profile
        shell: pwsh
        run: |
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          .\cxz.exe self-install
          if ($LASTEXITCODE -ne 0) { throw 'User installation failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\cxz\cxz.exe'
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash .\cxz.exe).Hash) {
            throw 'Installed executable differs from the source build'
          }
          $installedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (!$installedPath.StartsWith($originalUserPath)) { throw 'Existing user PATH changed' }
          & $installed windows-install
          if ($LASTEXITCODE -ne 0) { throw 'Repeated installation failed' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -ne $installedPath) {
            throw 'Repeated installation changed user PATH'
          }
          $state = Join-Path $env:RUNNER_TEMP 'cxz client state 한글'
          & $installed --state $state integration add windows-terminal
          if ($LASTEXITCODE -ne 0) { throw 'Terminal registration failed' }
          & $installed --state $state integration add windows-terminal
          if ($LASTEXITCODE -ne 0) { throw 'Repeated Terminal registration failed' }
          $fragment = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\Fragments\cxz\cxz.json'
          $profiles = (Get-Content -Raw $fragment | ConvertFrom-Json).profiles
          if ($profiles.Count -ne 1 -or $profiles[0].name -ne 'cxz') { throw 'Unexpected Terminal profiles' }
          $status = & $installed integration ls
          if ($LASTEXITCODE -ne 0 -or !($status -match '^windows-terminal  registered')) { throw 'Registration status missing' }
          & $installed integration remove windows-terminal
          if ($LASTEXITCODE -ne 0 -or (Test-Path $fragment)) { throw 'Terminal removal failed' }
          $status = & $installed integration ls
          if ($LASTEXITCODE -ne 0 -or !($status -match '^windows-terminal  not registered')) { throw 'Removal status missing' }
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: go vet ./...
      - run: go test ./...
      - run: CXZ_TEST_USE_DOCKER=1 go test ./internal/versionuse -run TestForceProjectReleaseSwitchDocker -v -count=1
      - run: CXZ_TEST_USE_DOCKER=1 go test ./internal/auxiliary -run TestAuxiliaryHelperDocker -v -count=1
      - run: CXZ_TEST_WEB_DOCKER=1 go test ./internal/installer -run 'TestWebDocker|TestRelayDocker' -v -count=1
      - run: go run ./tools/genproto && git diff --exit-code -- api
      - run: go tool pd gen --check .
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Run race tests and collect timings
        shell: bash
        run: CXZ_TEST_RACE=1 go test -race -json ./... -count=1 | tee "$RUNNER_TEMP/race-tests.jsonl"
      - name: Summarize race test timings
        if: always()
        run: python3 scripts/summarize-go-tests.py "$RUNNER_TEMP/race-tests.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: race-test-timings
          path: ${{ runner.temp }}/race-tests.jsonl
          retention-days: 7
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~\AppData\Local\go-build
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: bash scripts/release.sh edge
      - run: dist/linux-amd64/cxz version
      # Tar preserves executable permissions across artifact upload/download.
      - run: tar -cf release-artifacts.tar dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts.tar
          path: release-artifacts.tar
          retention-days: 3
          # Already a tar: avoid redundant ZIP wrapping and extraction.
          archive: false
  image:
    outputs:
      digest: ${{ fromJSON(steps.manager-image.outputs.metadata).app['containerimage.digest'] }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REPO: ghcr.io/${{ github.repository }}
      TAG: edge
      APP_VERSION: edge
      BUILD_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set source build version
        run: echo "APP_VERSION=source-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts.tar
          skip-decompress: true
      - run: tar -xf release-artifacts.tar
      - name: Check native binary
        run: dist/linux-amd64/cxz version
      - name: Validate manager image
        id: manager-image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: app
          push: false
          set: |
            app.cache-from=type=gha,scope=cxz-app
            app.cache-to=type=gha,scope=cxz-app,mode=max
  publish:
    needs: [test, race, windows-frontend, web, web-storybook, web-sandbox, image]
    # A suite this change cannot reach is skipped, and a skipped dependency
    # would otherwise skip the release with it -- so this asks that nothing
    # failed rather than that everything succeeded.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-edge.yml
