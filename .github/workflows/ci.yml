name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: cxz-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-frontend:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./cmd/cxz ./internal/transport ./internal/core ./internal/settings ./internal/selfupdate
      - run: go test ./internal/tui -run TestWindows -count=1
      - run: go build -o cxz.exe ./cmd/cxz
      - run: .\cxz.exe version
      - run: .\cxz.exe terminal-info --plain
      - name: Install the Windows frontend and register its Terminal profile
        shell: pwsh
        run: |
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          .\cxz.exe self-install
          if ($LASTEXITCODE -ne 0) { throw 'User installation failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\cxz\cxz.exe'
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash .\cxz.exe).Hash) {
            throw 'Installed executable differs from the source build'
          }
          $installedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (!$installedPath.StartsWith($originalUserPath)) { throw 'Existing user PATH changed' }
          & $installed windows-install
          if ($LASTEXITCODE -ne 0) { throw 'Repeated installation failed' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -ne $installedPath) {
            throw 'Repeated installation changed user PATH'
          }
          $state = Join-Path $env:RUNNER_TEMP 'cxz client state 한글'
          & $installed --state $state integration add windows-terminal
          if ($LASTEXITCODE -ne 0) { throw 'Terminal registration failed' }
          & $installed --state $state integration add windows-terminal
          if ($LASTEXITCODE -ne 0) { throw 'Repeated Terminal registration failed' }
          $fragment = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\Fragments\cxz\cxz.json'
          $profiles = (Get-Content -Raw $fragment | ConvertFrom-Json).profiles
          if ($profiles.Count -ne 1 -or $profiles[0].name -ne 'cxz') { throw 'Unexpected Terminal profiles' }
          $status = & $installed integration ls
          if ($LASTEXITCODE -ne 0 -or !($status -match '^windows-terminal  registered')) { throw 'Registration status missing' }
          & $installed integration remove windows-terminal
          if ($LASTEXITCODE -ne 0 -or (Test-Path $fragment)) { throw 'Terminal removal failed' }
          $status = & $installed integration ls
          if ($LASTEXITCODE -ne 0 -or !($status -match '^windows-terminal  not registered')) { throw 'Removal status missing' }
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: CXZ_TEST_RACE=1 go test -race ./... -count=1
      - run: go run ./tools/genproto && git diff --exit-code -- api
      - run: go tool pd gen --check .
      - run: bash scripts/release.sh v0.0.0-ci
      - run: dist/linux-amd64/cxz version
  frontend-downloads:
    needs: [test, windows-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/release.sh edge
      - name: Publish downloadable main builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view edge >/dev/null 2>&1; then
            gh release create edge --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Latest main build' --notes 'Binaries from the latest successfully tested main build. Download SHA256SUMS alongside the archive to verify it.'
          fi
          gh release upload edge --clobber dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit edge --target "$GITHUB_SHA"
  windows-update:
    needs: frontend-downloads
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Update the published frontend without external build tools
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'cxz-live-update'
          New-Item -ItemType Directory -Path $work | Out-Null
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/edge"
          $name = 'cxz-edge-windows-amd64.zip'
          $archive = Join-Path $work $name
          Invoke-WebRequest "$base/$name" -OutFile $archive
          $sums = Join-Path $work 'SHA256SUMS'
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile $sums
          $expected = (Get-Content $sums | Where-Object { $_.EndsWith("  $name") }) -split '\s+'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[0]) {
            throw 'Bootstrap archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath (Join-Path $work 'bin')
          $exe = Join-Path $work 'bin/cxz.exe'
          $env:PATH = Join-Path $work 'empty-path'
          New-Item -ItemType Directory -Path $env:PATH | Out-Null
          & $exe --state (Join-Path $work 'state') self-update
          if ($LASTEXITCODE -ne 0) { throw 'Docker-free self-update failed' }
          if (!(Test-Path (Join-Path $work 'bin/cxz.previous.exe'))) { throw 'Missing previous executable' }
          $version = & $exe version
          if ($LASTEXITCODE -ne 0 -or !$version.Contains("source-$($env:GITHUB_SHA.Substring(0, 12))")) {
            throw "Unexpected updated version: $version"
          }
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository }}
      TAG: edge
      APP_VERSION: edge
      BUILD_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Bake binaries
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          targets: build
          set: |
            build.cache-from=type=gha,scope=cxz-build
            build.cache-to=type=gha,scope=cxz-build,mode=max
      - name: Check native binary
        run: dist/linux-amd64/cxz version
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake manager image (publish only main pushes)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          targets: app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          set: |
            app.cache-from=type=gha,scope=cxz-app
            app.cache-to=type=gha,scope=cxz-app,mode=max
