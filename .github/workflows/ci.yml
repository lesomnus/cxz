name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: CXZ_TEST_RACE=1 go test -race ./... -count=1
      - run: go run ./tools/genproto && git diff --exit-code -- api
      - run: bash scripts/release.sh v0.0.0-ci
      - run: dist/linux-amd64/cxz version
