name: Publish edge
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: cxz-edge-publication
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-edge-publication.py
  image:
    outputs:
      digest: ${{ fromJSON(steps.manager-image.outputs.metadata).app['containerimage.digest'] }}
    needs: freshness
    if: needs.freshness.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository }}
      TAG: edge
      APP_VERSION: edge
      BUILD_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set source build version
        run: echo "APP_VERSION=source-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
      - run: tar -xf release-artifacts.tar
      - name: Check native binary
        run: dist/linux-amd64/cxz version
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake manager image (publish only main pushes)
        id: manager-image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          set: |
            app.cache-from=type=gha,scope=cxz-app
            app.cache-to=type=gha,scope=cxz-app,mode=max
  frontend-downloads:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
      - run: tar -xf release-artifacts.tar
      - name: Publish downloadable main builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANAGER_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python3 scripts/update-manifest.py dist "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "ghcr.io/$GITHUB_REPOSITORY@$MANAGER_DIGEST"
          if ! gh release view edge >/dev/null 2>&1; then
            gh release create edge --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Latest main build' --notes 'Binaries from the latest successfully tested main build. Download SHA256SUMS alongside the archive to verify it.'
          fi
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          existing_assets=$(gh release view edge --json assets --jq '.assets[].name')
          for artifact in dist/auto-update/*; do
            name=$(basename "$artifact")
            if echo "$existing_assets" | grep -Fxq "$name"; then
              gh release download edge --pattern "$name" --dir "$verify_dir"
              cmp "$artifact" "$verify_dir/$name" # a revision asset is immutable
            else
              gh release upload edge "$artifact"
            fi
          done
          gh release upload edge --clobber dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          # Publish the manifest last: all assets and the pinned image now exist.
          gh release upload edge --clobber dist/cxz-update.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit edge --target "$GITHUB_SHA"
          python3 scripts/prune-edge-assets.py dist/cxz-update.json
  windows-update:
    needs: frontend-downloads
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Update the published frontend without external build tools
        env:
          # Shared runner IPs can exhaust the anonymous release-metadata quota.
          CXZ_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'cxz-live-update'
          New-Item -ItemType Directory -Path $work | Out-Null
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/edge"
          $name = 'cxz-edge-windows-amd64.zip'
          $archive = Join-Path $work $name
          Invoke-WebRequest "$base/$name" -OutFile $archive
          $sums = Join-Path $work 'SHA256SUMS'
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile $sums
          $expected = (Get-Content $sums | Where-Object { $_.EndsWith("  $name") }) -split '\s+'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[0]) {
            throw 'Bootstrap archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath (Join-Path $work 'bin')
          $exe = Join-Path $work 'bin/cxz.exe'
          $env:PATH = Join-Path $work 'empty-path'
          New-Item -ItemType Directory -Path $env:PATH | Out-Null
          & $exe --state (Join-Path $work 'state') self-update
          if ($LASTEXITCODE -ne 0) { throw 'Docker-free self-update failed' }
          if (!(Test-Path (Join-Path $work 'bin/cxz.previous.exe'))) { throw 'Missing previous executable' }
          $version = & $exe version
          if ($LASTEXITCODE -ne 0 -or !$version.Contains("source-$($env:GITHUB_SHA.Substring(0, 12))")) {
            throw "Unexpected updated version: $version"
          }
