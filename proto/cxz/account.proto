edition = "2023";
package cxz;
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/cxz/resource";

// An agent authentication profile, not a cxz user or tenant. Secrets never
// enter resource fields, audit records, or API responses.
message Account {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  string alias = 4 [(orm.field) = {unique: true}];
  string name = 5;
  string desc = 6;
  string agent = 8 [(orm.field) = {immutable: true}];
  string auth_backend = 9 [(orm.field) = {immutable: true}];
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true, default: ""}];
  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 9
    global: {}
    list: {order: [{field: {name: "date_created"}}, {field: {name: "id"}}], by: [{name: "ref"}], size: 50, max: 200}
    watch: {}
  };
}
