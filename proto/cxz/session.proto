edition = "2023";
package cxz;
import "cxz/project.proto";
import "cxz/account.proto";
import "cxz/auth_binding.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/cxz/resource";

// The durable conversation identity. Runtime/run IDs and journal cursors are
// operational state, not caller-patchable columns.
message Session {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  // Nullable only for upgrading older databases; lifecycle assigns every session.
  string alias = 4 [(orm.field) = {unique: true, nullable: true}];
  string name = 5;
  string desc = 6;
  Project project = 8 [(orm.edge) = {immutable: true}];
  string agent = 9 [(orm.field) = {immutable: true}];
  string model = 10 [(orm.field) = {immutable: true}];
  string runtime_id = 11 [(orm.field) = {unique: true, immutable: true}];
  string client_id = 12 [(orm.field) = {unique: true, immutable: true}];
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true, default: ""}];
  SessionStatus status = 16;
  bool listed = 17 [(orm.field) = {default: "true"}];
  Account account = 18 [(orm.edge) = {immutable: true}];
  AuthBinding auth_binding = 19 [(orm.edge) = {immutable: true}];
  option (orm.message) = {
    rpc: {crud: true}
    indexes: [{name: "page", refs: [{name: "date_created", number: 15}, {name: "id", number: 1}]}]
  };
  option (payday.entity) = {
    domain: 8
    global: {}
    list: {order: [{field: {name: "date_created"}}, {field: {name: "id"}}], by: [{name: "ref"}, {name: "project"}, {name: "account"}, {name: "listed"}], size: 50, max: 200}
    watch: {}
  };
}

message SessionStatus {
  string state = 1;
  string run_id = 2;
  string vendor_id = 3;
  uint64 last_seq = 4;
  repeated SessionEvent pending = 5;
  string permission_mode = 6;
  string queued = 7;
}

message SessionEvent {
  string run_id = 1;
  uint64 seq = 2;
  int64 time_ms = 3;
  string kind = 4;
  string text = 5;
  string request_id = 6;
  bytes payload = 7;
  ResponseMetadata response = 8;
  // Present only on a derived transcript row, never in the native live journal.
  ToolSummary tool_summary = 9;
  // A frame that is not a record. A reader cannot tell an open stream with
  // nothing to send from one that has stalled -- both are silence -- and only
  // the sending side knows which it is, so it says so on an interval. Nothing
  // else on such a frame is set: it carries no sequence, so a reader that
  // advances its cursor by what it receives must skip it rather than rewind.
  //
  // The row stream says this by sending a row with no event, which needs no
  // field of its own. A record stream's frame *is* the record, so saying it
  // here is the only place it can be said. See cxz#191.
  bool heartbeat = 10;
}

message ToolSummary {
  string name = 1; string shell = 2; string command = 3; string state = 4;
  repeated ToolFileSummary files = 5;
  uint32 omitted_files = 6;
  // What shape this call is, which is what a reader lays out: command, files,
  // read, or tool for one whose name is all that is known. Not inferable from
  // the other fields -- a Read carries the path it read in `command` as well as
  // in `files`, so a reader guessing from `command` would draw it as a shell.
  string kind = 7;
  // What the provider said this call is, when it said anything: Bash's own
  // description, or a Skill with its arguments. Empty otherwise, and a reader
  // falls back to `name` rather than this repeating it.
  string description = 8;
}
// Counts describe recorded diff hunks or submitted content/replacement spans.
// An unknown measure never implies zero changes.
message ToolFileSummary {
  string path = 1; string move_path = 2; string action = 3;
  uint32 added = 4; uint32 removed = 5; uint32 lines = 6;
  string measure = 7; bool per_match = 8;
}

// Frozen response context; sources are response, settings or requested.
// Empty values mean the provider/configuration did not supply a known value.
message ResponseMetadata {
  string model = 1;
  string effort = 2;
  string model_source = 3;
  string effort_source = 4;
  string turn_id = 5;
  string phase = 6;
  // Immutable successful-turn summary referencing the final assistant seq.
  bytes completion_json = 7;
}
