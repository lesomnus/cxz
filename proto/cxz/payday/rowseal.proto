edition = "2023";

package cxz;

import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/cxz/resource";

// RowSeal is a row's seal: the MAC that vouches for the fields of it the
// trail's digest leaves out -- the ones its kind declared `personal` -- kept
// beside the row, in the database alone, for exactly as long as the row is
// (payday#115). See `audit.Digest.Seal`.
//
// # Why a table of its own
//
// The digest is on a line of the trail, and a line is copied to the archive
// and kept for years after its row has gone, and after its person has been
// forgotten: a keyed MAC of somebody's address kept that long is something of
// them that outlives their erasure. A seal lives with what it vouches for
// instead. It is written in the transaction of every write that leaves a row
// of a sealed kind, kept for the commit with the trail and written with it --
// a statement for every few hundred rows -- removed with the row, and blanked
// when the person is forgotten (`trail.Policy.Forget`). Never on the trail,
// and never in the archive.
//
// A table and not a column of every entity that declares a field personal:
// a column would be the app's row grown by payday, carried by every read of
// it, every copy the outbox and the access record make, and every export --
// and written by the statement that writes the row, before the database has
// said what the row is. The seal is of the row as the database answers with
// it, which the recorder has once the write is done.
//
// # What a row of it says
//
// One per row there is of a sealed kind, under the row's own identifier, so a
// write seals by writing over the seal before it. A row's seal names the line
// of the trail whose write made it -- bound to it, so a seal kept from an
// earlier write is not the newest line's -- and the digest of that line says
// the write sealed the row, so a row with no seal where one was made is a
// finding of its own.
message RowSeal {
  // The row this is the seal of: its identifier, of whatever kind it is.
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The tenant the write that sealed it filed its line under, as a column
  // and not an edge, as the trail's is: what a tenant purged takes with it
  // (`trail.Policy.PurgeTenant`). The zero identifier for a row of no tenant.
  bytes tenant_id = 2 [(orm.field) = {type: TYPE_UUID}];

  // The seal: a byte of version, a byte of what it is, and two halves of a
  // fingerprint and an HMAC, as a digest's -- the first its binding to the
  // line, the second the row's, under a key derived from `audit.digest.key`.
  // One that says the row's person was forgotten is the first half alone, of
  // the row's identifier and nothing it holds.
  bytes sum = 8;

  // The fields `sum` covers, by number: every field of the row the build that
  // sealed it knew, the personal ones among them.
  repeated uint32 fields = 9;

  // No RPCs, for the reason `Archived` has none: a caller that could write a
  // seal could make a row changed past the servers pass for one that was not.
  // And no index but its key: it is written beside every write of a sealed
  // kind and read by the key alone, but for a tenant leaving, which is rare
  // enough to read the table for.
  option (orm.message) = {};
  option (payday.entity) = {
    own: OWN_ROW_SEAL

    // From the top of what a domain can be, where no app's entity is: an
    // app's are numbered up from 7, past payday's first six, and what payday
    // adds now it numbers down from 255 -- `pd entity add` gives an app's
    // entity a number below 248.
    domain: 255
    erase: {hard: {}}
    tenanted: {field: "tenant_id"}
  };
}
