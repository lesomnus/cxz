edition = "2023";

package cxz;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/cxz/resource";

// Archived is one blob of the trail's archive, as the database keeps the
// account of it: what the archive should hold, kept where the archive's own
// storage cannot reach. See `trail.Manifest`.
//
// # Why the database keeps it
//
// A chunk is named by its digest, so its bytes cannot change without its name
// changing. What its name does not say is whether the archive still holds
// **what it should** -- a chunk taken away, or one put there by somebody who is
// not the deployment, looks like any other. A record of what should be there is
// what tells them apart, and it is worth something only somewhere the archive's
// credentials do not reach. The database is that place, and it already does the
// rest of the work: its transactions are what put two writers in order, and its
// rows are what a crash leaves behind to say what was in flight.
//
// # Written before the archive changes, settled after
//
// An add is a row in `adding` before the blob is written, labelled with the
// row's `intent`, and `present` once the store holds it. An erase is `erasing`
// before the blob goes, and `erased` after. A crash between the two halves
// leaves a row that says what was happening, and a pass settles it from what
// the store holds once it is old enough not to be another pass still at it --
// which is why nothing a verification compares needs a clock to tell an act in
// flight from one that never happened.
//
// # Checkpoints
//
// `since` and `gone` are the checkpoints a row was first in and first not in,
// so the set a checkpoint was taken over can be read back from the rows. One
// row, with the zero identifier and no namespace, is the counter they are
// numbered by; its row lock is what keeps two checkpoints from sharing a
// number.
//
// # Signed
//
// What happens after the latest checkpoint is what a checkpoint cannot cover,
// so each row carries a signature by the deployment's key over what it says.
// A row is written whole with its signature, never a field of it alone.
message Archived {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // Not tenanted, and no header but the labels: 2 and 4..6 stay payday's,
  // empty. 7 is where an entity keeps its labels, and these are the blob's --
  // the ones a pass decides by.
  map<string, string> labels = 7;

  // The namespace of the archive the blob is in, and its digest -- empty while
  // the row is adding, since a blob's digest is known once it is written.
  string namespace = 8;
  string digest = 9;

  // What the blob is labelled with while its row is adding, so that a crash
  // between writing it and saying so leaves something to match the two by.
  string intent = 10;

  // adding | present | erasing | erased
  string state = 11;

  // The first checkpoint the row was in, and zero before one.
  uint32 since = 12;

  // When the row last changed: how long an erase has been in flight, which
  // is what keeps a pass from undoing one another pass is still making.
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // The first checkpoint the row was not in, once it was erased, and zero
  // while it is in them.
  uint32 gone = 16;

  // The deployment's key's signature over what the row says, and the public
  // half of that key, PKIX: what keeps a row changed after the latest
  // checkpoint from passing for one the deployment wrote. See
  // `trail.Signature`.
  //
  // Empty on a row written without a key, and on every row from before rows
  // were signed -- which is also why they have a default: a column nothing
  // can be left out of cannot be added to a table that has rows.
  bytes signature = 17 [(orm.field) = {default: ""}];
  bytes signed_by = 18 [(orm.field) = {default: ""}];

  // No RPCs, for the reason `Outbox` has none: this is the deployment's record
  // of its own archive, and a caller that could write it could hide a chunk
  // or plant one.
  option (orm.message) = {
    indexes: [
      {
        name: "blob"
        refs: [
          {
            name: "namespace"
            number: 8
          },
          {
            name: "digest"
            number: 9
          }
        ]
      },
      {
        name: "state"
        refs: [
          {
            name: "state"
            number: 11
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    own: OWN_ARCHIVED

    // 5 in every app but one whose own entity held 5 before this did, which
    // gives this a number of its own -- `option (payday.app) = {domains:
    // {archived: ...}}` -- and `pd gen` writes it over this line (payday#163).
    domain: 5

    // A row is gone once no checkpoint it was in is read back any more.
    erase: {hard: {}}

    // The deployment's, and no tenant's: an archive holds every tenant's
    // chunks, and the account of it is one account.
    global: {}
  };
}
