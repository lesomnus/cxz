edition = "2023";
package cxz;

import "cxz/account_svc.g.proto";
import "cxz/auth_binding_svc.g.proto";
import "cxz/project_svc.g.proto";
import "cxz/session.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";

option go_package = "github.com/lesomnus/cxz/resource";

service SessionService {
  // Add creates a new Session
  rpc Add(SessionAddRequest) returns (Session);
  // Get retrieves a Session
  rpc Get(SessionGetRequest) returns (Session);
  // Patch updates an existing Session
  rpc Patch(SessionPatchRequest) returns (Session);
  // Apply applies a patch document to an existing Session
  rpc Apply(SessionApplyRequest) returns (Session);
  // Erase deletes a Session
  rpc Erase(SessionRef) returns (SessionEraseResponse);
  // List reads Sessions a page at a time.
  rpc List(SessionListRequest) returns (SessionListResponse);
  // Watch the Sessions this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(SessionWatchRequest) returns (stream SessionWatchResponse);
  // Read retained conversation statistics, never account billing or lifetime totals.
  rpc ConversationStats(ConversationStatsRequest) returns (ConversationStatsReply);
  rpc Restore(SessionRef) returns (Session);
  rpc Resume(SessionControl) returns (Session);
  rpc Stop(SessionControl) returns (Session);
  rpc Interrupt(SessionControl) returns (SessionReceipt);
  rpc CopyMemory(SessionCopyMemoryRequest) returns (SessionReceipt);
  rpc Library(SessionLibraryRequest) returns (SessionMemoryReply);
  rpc Memory(SessionMemoryRequest) returns (SessionMemoryReply);
  rpc Logs(SessionLogsRequest) returns (SessionLogsReply);
  rpc Permission(SessionPermissionRequest) returns (SessionReceipt);
  rpc Send(SessionSendRequest) returns (SessionReceipt);
  rpc Attach(SessionAttachRequest) returns (SessionAttachment);
  rpc Upload(stream SessionUploadRequest) returns (SessionAttachment);
  rpc Activity(SessionActivityRequest) returns (SessionReceipt);
  rpc UpdateAgent(SessionUpdateRequest) returns (SessionUpdateStatus);
  rpc Reply(SessionReplyRequest) returns (SessionReceipt);
  // Journal replay is not payday Watch: it is cursor-ordered event history.
  rpc History(SessionEventsRequest) returns (SessionEventBatch);
  // Readable, indexed history. Paging counts transcript rows, not protocol records.
  rpc Transcript(SessionTranscriptRequest) returns (SessionTranscriptReply);
  // Full native records for one row/execution, fetched only for inspection.
  rpc EventDetails(SessionEventDetailsRequest) returns (SessionEventBatch);
  rpc Background(SessionBackgroundRequest) returns (SessionBackgroundReply);
  rpc Models(SessionModelsRequest) returns (SessionModelsReply);
  rpc Events(SessionEventsRequest) returns (stream SessionEvent);
  // Search answers across every session in every project, so it names no ref.
  // It is on this service because sessions are what it finds.
  rpc Search(SessionSearchRequest) returns (stream SessionSearchReply);
}

message SessionAddRequest {
  bytes id = 1;
  string alias = 4;
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  ProjectRef project = 8;
  string agent = 9 [features.field_presence = IMPLICIT];
  string model = 10 [features.field_presence = IMPLICIT];
  string runtime_id = 11 [features.field_presence = IMPLICIT];
  string client_id = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  SessionStatus status = 16;
  bool listed = 17;
  AccountRef account = 18;
  AuthBindingRef auth_binding = 19;
}

message SessionGetRequest {
  SessionRef ref = 1;
  SessionSelect select = 2;
}

message SessionRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
    string runtime_id = 11;
    string client_id = 12;
  }
}

message SessionSelect {
  bool all = 1;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  ProjectSelect project = 8;
  bool agent = 9;
  bool model = 10;
  bool runtime_id = 11;
  bool client_id = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool status = 16;
  bool listed = 17;
  AccountSelect account = 18;
  AuthBindingSelect auth_binding = 19;
}

message SessionPatchRequest {
  SessionRef ref = 1;
  string alias = 8;
  // Clear alias instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and alias clears.
  bool alias_null = 9;
  string name = 10;
  string desc = 12;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  SessionStatus status = 32;
  // Clear status instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and status clears.
  bool status_null = 33;
  bool listed = 34;
}

message SessionApplyRequest {
  SessionRef ref = 1;
  patch.Patch patch = 2;
}

message SessionEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message SessionListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated SessionFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message SessionListResponse {
  repeated Session items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message SessionFilter {
  SessionRef ref = 1;
  ProjectRef project = 2;
  bool listed = 3;
}

message SessionWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated SessionFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message SessionWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated SessionWatchItem items = 1;
}

message SessionWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Session value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

// Omit both refs for all listed sessions; refs are mutually exclusive.
// UTC half-open [from_ms, to_ms); defaults to the last 30 days, maximum 366 days.
message ConversationStatsRequest {
  ProjectRef project = 1;
  SessionRef session = 2;
  int64 from_ms = 3;
  int64 to_ms = 4;
}

message ConversationStatsReply {
  int64 from_ms = 1;
  int64 to_ms = 2;
  int64 generated_ms = 3;
  ConversationStatsValues total = 4;
  repeated ConversationStatsDay days = 5;
  repeated ConversationStatsCoverage sessions = 6;
  bool complete = 7;
}

message ConversationStatsValues {
  uint64 events = 1;
  uint64 input_messages = 2;
  uint64 assistant_events = 3;
  // UTF-8 text bytes of input/assistant events; not a database/disk size.
  uint64 conversation_bytes = 4;
  // UTF-8 text + payload bytes of all events, excluding serialization overhead.
  uint64 event_content_bytes = 5;
  uint64 finished_turns = 6;
  // Uncached input; cache tokens are separate for both Claude and Codex.
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  uint64 cache_read_tokens = 9;
  uint64 cache_write_tokens = 10;
  uint64 token_reported_turns = 11;
  double reported_cost_usd = 12;
  uint64 cost_reported_turns = 13;
}

message ConversationStatsDay {
  string date = 1;
  ConversationStatsValues values = 2;
}

message ConversationStatsCoverage {
  bytes session_id = 1;
  string alias = 2;
  uint64 snapshot_seq = 3;
  uint64 first_seq = 4;
  uint64 last_seq = 5;
  // True only if every seq from 1 through snapshot_seq was observed.
  bool complete = 6;
}

message SessionControl {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
}

message SessionReceipt {
  string client_id = 1;
  string status = 2;
}

message SessionCopyMemoryRequest {
  SessionRef ref = 1;
  string path = 2;
  SessionRef target = 3;
  string target_path = 4;
}

message SessionLibraryRequest {
  SessionRef ref = 1;
  bytes request = 2;
}

message SessionMemoryReply {
  bytes data = 1;
}

message SessionMemoryRequest {
  SessionRef ref = 1;
  string path = 2;
}

message SessionLogsRequest {
  SessionRef ref = 1;
  bool project = 2;
}

message SessionLogsReply {
  string text = 1;
}

message SessionPermissionRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
  string mode = 4;
}

// cancel takes back the message waiting to be sent, instead of sending text.
message SessionSendRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
  string text = 4;
  bool cancel = 5;
}

message SessionAttachRequest {
  SessionRef ref = 1;
  string run_id = 2;
  bytes content = 3;
}

message SessionAttachment {
  string path = 1;
}

// The first message contains the header; subsequent messages contain only bytes.
// Closing the stream completes the upload. No upload IDs or resumable state.
message SessionUploadRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string name = 3;
  int64 size = 4;
  bytes content = 5;
}

message SessionActivityRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
  bool busy = 4;
}

message SessionUpdateRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string binary = 3;
  bool apply = 4;
  string supervisor_binary = 5;
}

message SessionUpdateStatus {
  bool ready = 1;
  string reason = 2;
  string binary = 3;
  string state = 4;
  string supervisor_binary = 5;
  string revision = 6;
  int32 protocol = 7;
}

message SessionReplyRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
  string request_id = 4;
  bool allow = 5;
  string answers_json = 6;
}

message SessionEventsRequest {
  SessionRef ref = 1;
  uint64 after_seq = 2;
  string client_id = 3;
}

message SessionEventBatch {
  repeated SessionEvent events = 1;
}

// No cursor selects the latest page. after_seq and before_seq are exclusive and
// mutually exclusive. snapshot_seq pins subsequent pages while live events arrive.
message SessionTranscriptRequest {
  SessionRef ref = 1;
  uint64 after_seq = 2;
  uint64 before_seq = 3;
  uint32 limit = 4;
  uint64 snapshot_seq = 5;
}

message SessionTranscriptReply {
  repeated SessionEvent events = 1;
  uint64 snapshot_seq = 2;
  bool has_older = 3;
  bool has_newer = 4;
  SessionEvent preceding_input = 5;
  repeated SessionEvent metadata = 6;
}

message SessionEventDetailsRequest {
  SessionRef ref = 1;
  uint64 seq = 2;
}

message SessionBackgroundRequest {
  SessionRef ref = 1;
}

message SessionBackgroundReply {
  uint64 last_seq = 1;
  bytes data = 2;
}

// The model catalog is a projection of the journal, served like background
// state: one request, no event scan. refresh additionally asks the agent, whose
// answer arrives as a journal event.
message SessionModelsRequest {
  SessionRef ref = 1;
  bool refresh = 2;
  string run_id = 3;
  string client_id = 4;
}

message SessionModelsReply {
  uint64 last_seq = 1;
  bytes data = 2;
  string run_id = 3;
  uint64 catalog_seq = 4;
  int64 catalog_ms = 5;
  bool refreshing = 6;
  string status = 7;
}

// A window is half-open, [since, until), so the windows a client walks back
// through -- a month at a time -- neither overlap nor skip. cursor continues one
// window and carries it, which is what keeps the second page asking the same
// question as the first while new events arrive above it.
//
// The bounds are timestamps rather than the journal's milliseconds because they
// are the caller's, not a journal's: an absent one is no bound at all, which a
// number would have had to spend a value on.
//
// projects and exclude are project runtime ids. A name or an alias is resolved
// where it was displayed: this is not the place to guess which was meant.
message SessionSearchRequest {
  string query = 1;
  string match = 2; // substring (default), regex or fuzzy
  bool ignore_case = 3;
  bool include_tools = 5;
  google.protobuf.Timestamp since = 6;
  google.protobuf.Timestamp until = 7;
  repeated string projects = 8;
  repeated string exclude = 9;
  repeated string sessions = 10;
  int32 limit = 11;
  int32 snippet = 12;
  string cursor = 13;
  string client_id = 14;
}

// Exactly one field is set. The summary comes last.
message SessionSearchReply {
  SessionSearchVisit visit = 1;
  SessionSearchProgress progress = 2;
  SessionSearchSummary summary = 3;
}

// One session's results, named once for all of them and newest first -- as the
// visits themselves are.
message SessionSearchVisit {
  string project_id = 1;
  string project_name = 2;
  string session_id = 3;
  string alias = 4;
  string title = 5;
  string agent = 6;
  string state = 7;
  // Milliseconds, like SessionEvent: these are the journal's own times.
  int64 activity_ms = 8;
  int64 created_ms = 9;
  // truncated says this session's older events are gone, so finding nothing in
  // it is not evidence that nothing was said.
  bool truncated = 10;
  repeated SessionSearchHit hits = 11;
}

message SessionSearchHit {
  uint64 seq = 1;
  int64 time_ms = 2;
  string kind = 3;
  int32 bytes = 4;
  int32 score = 5;
  string snippet = 6;
}

// Progress says what the index had to catch up on before answering, or could
// not. A search answers from a derived store, and a store that is behind says so
// rather than return an answer that looks complete.
message SessionSearchProgress {
  string project_id = 1;
  string project_name = 2;
  string state = 3; // indexed, behind or unavailable
  string message = 4;
  int32 done = 5;
  int32 total = 6;
}

// The summary says which window it answered for, because a continued page was
// not told: the window travelled in the cursor, and the client needs it back to
// say what it searched and to ask for the one before it.
message SessionSearchSummary {
  int32 projects = 1;
  int32 unavailable = 2;
  int32 sessions = 3;
  int32 hits = 4;
  int32 truncated = 5;
  string next_cursor = 6;
  bool has_more = 7;
  google.protobuf.Timestamp since = 8;
  google.protobuf.Timestamp until = 9;
  // examined is how many messages this page read, which is what the answer
  // cost; pending is how many conversations the index had not caught up with.
  int32 examined = 10;
  int32 pending = 11;
}
