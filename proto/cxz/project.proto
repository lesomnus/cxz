edition = "2023";
package cxz;
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/cxz/resource";
option (payday.app) = {};

// A registered workspace, independent of whether its container is running.
// No tenant: project-local capability checks remain a separate trust boundary.
message Project {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  string alias = 4 [(orm.field) = {unique: true}];
  string name = 5;
  string desc = 6;
  string workspace = 8 [(orm.field) = {unique: true, immutable: true}];
  string config = 9;
  reserved 10;
  reserved runtime_id;
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true, default: ""}];
  ProjectStatus status = 16;
  reserved 17;  // was `bool listed`: a project is registered or erased, nothing in between
  option (orm.message) = {
    rpc: {crud: true}
    indexes: [{name: "page", refs: [{name: "date_created", number: 15}, {name: "id", number: 1}]}]
  };
  option (payday.entity) = {
    domain: 7
    global: {}
    list: {order: [{field: {name: "date_created"}}, {field: {name: "id"}}], by: [{name: "ref"}], size: 50, max: 200}
    watch: {}
  };
}

// What cxz knows about a project's container. Facts, and one value derived
// from them: `container_state` is computed when a read is answered and written
// down nowhere, so nothing has to remember to update it and nothing can be read
// later as though it were still true. See docs/plans/project-lifecycle-api.md.
message ProjectStatus {
  reserved 1;  // was `string state`: a conclusion, stored
  string container_id = 2;
  string remote_user = 3;
  string remote_workspace = 4;
  string provision_state = 5;
  string provision_step = 6;
  uint64 provision_attempt = 7;
  string error = 8;
  ContainerState container_state = 9;
}

// Derived from the container inventory, every time it is asked. A look that
// failed is not an absence, which is why the two have separate values: the
// unspecified one means nothing was observed -- Docker could not be asked, or
// has not been asked yet.
enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_ABSENT = 1;
  CONTAINER_STATE_CREATED = 2;
  CONTAINER_STATE_RUNNING = 3;
  CONTAINER_STATE_STOPPED = 4;
}
