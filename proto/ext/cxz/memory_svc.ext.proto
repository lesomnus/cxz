edition = "2023";
package cxz;
import "cxz/memory.proto";
import "cxz/project_svc.g.proto";
import "cxz/session_svc.g.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/lesomnus/cxz/resource";

service MemoryService {
  rpc Read(MemoryReadRequest) returns (MemoryReadReply);
  rpc Versions(MemoryVersionsRequest) returns (MemoryVersionsReply);
  rpc Changes(MemoryChangesRequest) returns (MemoryChangesReply);
  rpc Restore(MemoryRestoreRequest) returns (Memory);
  rpc Purge(MemoryPurgeRequest) returns (MemoryEraseResponse);
}
message MemoryRef { ProjectRef project = 1000; }
message MemoryListRequest {
  ProjectRef project = 1000;
  SessionRef session = 1001;
  MemoryScope scope = 1002 [features.field_presence = IMPLICIT];
  string query = 1003 [features.field_presence = IMPLICIT];
}
message MemoryWatchRequest {
  ProjectRef project = 1000;
  SessionRef session = 1001;
  MemoryScope scope = 1002 [features.field_presence = IMPLICIT];
}
message MemoryPatchRequest { bool clear_labels = 1000 [features.field_presence = IMPLICIT]; uint64 base_revision = 1001 [features.field_presence = EXPLICIT]; }
enum MemoryScope { MEMORY_SCOPE_UNSPECIFIED = 0; MEMORY_SCOPE_ACTIVE = 1; MEMORY_SCOPE_TRASH = 2; }
enum MemoryReadFormat { MEMORY_READ_FORMAT_UNSPECIFIED = 0; MEMORY_READ_FORMAT_FULL = 1; MEMORY_READ_FORMAT_AUTO = 2; MEMORY_READ_FORMAT_DIFF = 3; }
message MemoryReadRequest { MemoryRef ref = 1; uint64 base_revision = 2 [features.field_presence = IMPLICIT]; uint64 revision = 3 [features.field_presence = IMPLICIT]; MemoryReadFormat format = 4 [features.field_presence = IMPLICIT]; }
message MemoryReadReply { Memory memory = 1; uint64 base_revision = 2 [features.field_presence = IMPLICIT]; uint64 revision = 3 [features.field_presence = IMPLICIT]; MemoryReadFormat format = 4 [features.field_presence = IMPLICIT]; string content = 5 [features.field_presence = IMPLICIT]; string diff = 6 [features.field_presence = IMPLICIT]; string fallback_reason = 7 [features.field_presence = IMPLICIT]; }
message MemoryVersion { bytes memory_id = 1; uint64 revision = 2 [features.field_presence = IMPLICIT]; string content_hash = 3 [features.field_presence = IMPLICIT]; google.protobuf.Timestamp date_created = 4; }
message MemoryVersionsRequest { MemoryRef ref = 1; uint64 before_revision = 2 [features.field_presence = IMPLICIT]; int32 size = 3 [features.field_presence = IMPLICIT]; }
message MemoryVersionsReply { repeated MemoryVersion versions = 1; uint64 next_revision = 2 [features.field_presence = IMPLICIT]; }
message MemoryChangesRequest { ProjectRef project = 1; string cursor = 2 [features.field_presence = IMPLICIT]; int32 size = 3 [features.field_presence = IMPLICIT]; }
message MemoryChange { uint64 sequence = 1 [features.field_presence = IMPLICIT]; string kind = 2 [features.field_presence = IMPLICIT]; bytes memory_id = 3; bytes project_id = 4; uint64 revision = 5 [features.field_presence = IMPLICIT]; }
message MemoryChangesReply { repeated MemoryChange changes = 1; string cursor = 2 [features.field_presence = IMPLICIT]; bool baseline = 3 [features.field_presence = IMPLICIT]; bool has_more = 4 [features.field_presence = IMPLICIT]; bool reset_required = 5 [features.field_presence = IMPLICIT]; }
message MemoryRestoreRequest { MemoryRef ref = 1; google.protobuf.Timestamp date_updated = 2; }
message MemoryPurgeRequest { MemoryRef ref = 1; google.protobuf.Timestamp date_updated = 2; }
