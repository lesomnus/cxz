edition = "2023";
package cxz;
import "cxz/account.proto";
option go_package = "github.com/lesomnus/cxz/resource";

service AccountService {
  // Local authentication readiness, never a provider-side verification or secret.
  rpc Status(AccountRef) returns (AccountAuthStatus);
  // Remove the central saved login and future token-supply authorizations.
  // Already-issued access tokens are not revoked at the provider.
  rpc Logout(AccountRef) returns (AccountAuthStatus);
}

message AccountAuthStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_READY = 1;
    STATE_LOGIN_REQUIRED = 2;
    STATE_SESSION_SCOPED = 3;
    STATE_BUSY = 4;
  }
  State state = 1;
  string scope = 2;
  bool credential_present = 3;
  bool vendor_verified = 4;
  bool can_login = 5;
  bool can_logout = 6;
  string message = 7;
}
