edition = "2023";
package cxz;
import "cxz/project.proto";
import "cxz/account_svc.g.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/lesomnus/cxz/resource";

service ProjectService {
  // Permanently remove one project and its owned data, preserving workspace sources.
  rpc Remove(ProjectRemoveRequest) returns (ProjectRemoveReply);
  // Ephemeral PTY on the manager host. First frame identifies a project and size;
  // later frames carry input or a resize. Terminal bytes are never journaled.
  rpc Terminal(stream ProjectTerminalRequest) returns (stream ProjectTerminalReply);
  // Ephemeral login transport. First frame identifies the session profile;
  // subsequent frames carry stdin only. These frames are never journaled.
  // Dedicated auxiliary account login; transient and never journaled.
  rpc AuxiliaryLogin(stream ProjectLoginRequest) returns (stream ProjectLoginOutput);
  rpc SessionLogin(stream ProjectLoginRequest) returns (stream ProjectLoginOutput);
  // Read immediate directory entries inside the project's container as its remote user.
  rpc Paths(ProjectPathsRequest) returns (stream ProjectPathsReply);
  // Stream a regular file as the project remote user; never journal file contents.
  rpc Download(ProjectDownloadRequest) returns (stream ProjectDownloadReply);
  // Start/reuse the project's browser editor. The browser gateway removes the
  // private token from RPC replies and scopes its workbench cookie to the proxy.
  rpc Editor(ProjectEditorRequest) returns (ProjectEditorReply);
  // Private gateway transport to the editor's loopback listener; not web RPC.
  rpc EditorTunnel(stream ProjectEditorTunnelRequest) returns (stream ProjectEditorTunnelReply);
 rpc Devcontainer(DevcontainerRequest) returns (DevcontainerReply);
 rpc Docker(DockerRequest) returns (DockerReply);
  // Aux is a model task done beside a session: run once, with the context cxz
  // assembles, never accumulating into a conversation. These four are the part
  // that belongs to the installation rather than to one session -- which
  // account and model each kind runs on. See docs/plans/aux-api.md.
  rpc AuxConfig(AuxConfigRequest) returns (AuxConfigReply);
  rpc AuxSetConfig(AuxSetConfigRequest) returns (AuxConfigReply);
  rpc AuxModels(AuxModelsRequest) returns (AuxModelsReply);
  rpc AuxLoginInfo(AuxLoginInfoRequest) returns (AuxLoginInfoReply);
  // A secret file is written by the workspace helper inside a project
  // container, for a client that cannot reach the engine itself. Two calls
  // rather than one with a verb: only one of them carries a secret, and that
  // difference is the whole of what has to be obvious here.
  //
  // Whether the link may carry it at all is decided by the client, because the
  // exposed TCP surface is authenticated plaintext and cannot be told apart
  // from a local socket on this side. See internal/transport.Confidential.
  // The history budgets of this installation. They bound cxz's own records
  // only; provider context is not affected. See docs/history.md.
  // Asked by a session supervisor before it compacts a journal, so that a
  // release predating trimming refuses the projection rather than serving
  // history that is gone. A failure stops the compaction.
  rpc MarkHistoryTrimmable(HistoryTrimmableRequest) returns (HistoryTrimmableReply);
  rpc GetHistoryPolicy(HistoryPolicyRequest) returns (HistoryPolicy);
  rpc SetHistoryPolicy(HistoryPolicy) returns (HistoryPolicy);
  rpc PutSecretFile(PutSecretFileRequest) returns (SecretFileReply);
  rpc DeleteSecretFile(DeleteSecretFileRequest) returns (SecretFileReply);
  rpc FileMappings(FileMappingsRequest) returns (FileMappingsReply);
  // Provision/start a registered workspace. This never creates a conversation.
  rpc Up(ProjectUpRequest) returns (Project);
  // Remove owned containers, retaining the resource, workspace and volumes.
  rpc Down(ProjectControl) returns (Project);
  // Replace only explicitly confirmed targets. Foreign containers are not adopted.
  rpc Recreate(ProjectRecreateRequest) returns (Project);
  // Foreign inventory is not part of the registered Project resource list.
  rpc InspectForeign(InspectForeignRequest) returns (InspectForeignResponse);
}

message ProjectTerminalRequest {
  ProjectRef ref = 1;
  uint32 columns = 2;
  uint32 rows = 3;
  bytes input = 4;
}
message ProjectTerminalReply {
  bool ready = 1;
  bytes output = 2;
  bool exited = 3;
  string error = 4;
}

message ProjectLoginRequest {
  ProjectRef ref = 1;
  AccountRef account = 2;
  string session_key = 3;
  bytes input = 4;
}
message ProjectLoginOutput { bytes output = 1; }

message ProjectPathsRequest { ProjectRef ref = 1; string path = 2; }
// Each reply appends entries; the final reply also reports truncation.
message ProjectPathsReply { repeated ProjectPathEntry entries = 1; bool truncated = 2; }
message ProjectPathEntry {
  string name = 1;
  bool directory = 2;
  bool executable = 3;
  bool symlink = 4;
  string link_target = 5;
}

message ProjectUpRequest {
  ProjectRef ref = 1;
  string client_id = 2;
  string agent = 3;
  bool trust_config = 4;
  string config = 5;
}
message ProjectControl { ProjectRef ref = 1; string client_id = 2; }
message ProjectRecreateRequest {
  ProjectRef ref = 1;
  string client_id = 2;
  string agent = 3;
  bool trust_config = 4;
  bool confirmed = 5;
  string config = 6;
}
message InspectForeignRequest {}
message InspectForeignResponse { repeated ForeignContainer items = 1; }
message ForeignContainer { string container_id = 1; string workspace = 2; string name = 3; }

message FileMappingsRequest { bytes bundle = 1; }
message FileMappingsReply { string status = 1; }

message DockerRequest { string action = 1; bytes spec = 2; }

message DockerReply { string status = 1; }

message DevcontainerRequest { bytes spec = 1; }
message DevcontainerReply { string status = 1; }

message ProjectDownloadRequest { ProjectRef ref = 1; string path = 2; }
message ProjectDownloadReply { bytes data = 1; int64 total_size = 2; }

message ProjectEditorRequest { ProjectRef ref = 1; }
message ProjectEditorReply { string workspace = 1; string connection_token = 2; bool simulated = 3; }
message ProjectEditorTunnelRequest { ProjectRef ref = 1; bytes input = 2; }
message ProjectEditorTunnelReply { bool ready = 1; bytes output = 2; }

message ProjectRemoveRequest { string target = 1; bool confirmed = 2; }
message ProjectRemoveReply { Project project = 1; bool removed = 2; }

// The kinds of task that can be done beside a session. A new kind is a value
// here, not another RPC.
enum AuxKind {
  AUX_KIND_UNSPECIFIED = 0;
  AUX_KIND_SUMMARY = 1;
  AUX_KIND_SUGGESTION = 2;
  AUX_KIND_TITLE = 3;
}
// Which account and model run a kind. Per kind, because whether two kinds share
// a profile is what decides whether one call can answer both. agent and backend
// are read only: they come from the registered account, not from a caller.
message AuxProfile {
  AuxKind kind = 1; bool enabled = 2; string account = 3; string agent = 4;
  string backend = 5; string model = 6; string effort = 7;
  // Read only: the boundary the server set when the kind was enabled, so a
  // caller can say what it applies to. Ignored when it arrives.
  google.protobuf.Timestamp since = 8;
}
message AuxModel {
  string id = 1; string resolved_id = 2; string name = 3;
  repeated string efforts = 4; string default_effort = 5; bool default = 6;
}
message AuxConfigRequest {}
message AuxSetConfigRequest { repeated AuxProfile profiles = 1; }
message AuxConfigReply {
  string revision = 1; repeated AuxProfile profiles = 2;
  string message = 3; string owner = 4;
}
// A catalog read for one registered account. It does not generate a response,
// and it does not prove a stored token will be accepted for one.
message AuxModelsRequest { string account = 1; }
message AuxModelsReply { repeated AuxModel models = 1; bool needs_login = 2; }
// Where a login has to happen and under which profile. No credential travels
// here, which is why it is separate from the stream that performs one.
message AuxLoginInfoRequest { string account = 1; }
message AuxLoginInfoReply {
  string owner = 1; string account = 2; string agent = 3; string backend = 4;
}

// session is the runtime id and not a SessionRef: it names the scope the helper
// writes under rather than a row to look up, and this contract cannot refer to
// the session one -- the dependency runs the other way.
message PutSecretFileRequest { ProjectRef ref = 1; string session = 2; bytes secret = 3; }
message DeleteSecretFileRequest { ProjectRef ref = 1; string path = 2; }
message SecretFileReply { string path = 1; }

message HistoryTrimmableRequest {}
message HistoryTrimmableReply {}
message HistoryPolicyRequest {}
// disabled turns removal off entirely; zero in a budget means the default. Both
// budgets are per session.
message HistoryPolicy {
  bool disabled = 1; int32 max_mib = 2; int32 raw_mib = 3;
  int32 window_mib = 4; int32 window_turns = 5;
}
