edition = "2023";
package cxz;
import "cxz/project.proto";
import "cxz/account_svc.g.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/lesomnus/cxz/resource";

message ProjectWatchResponse {
  // Present on initial snapshot pages; true on the final page. Live changes omit it.
  bool snapshot_complete = 1000;
}

service ProjectService {
  // Permanently remove one project and its owned data, preserving workspace sources.
  // Ephemeral PTY on the manager host. First frame identifies a project and size;
  // later frames carry input or a resize. Terminal bytes are never journaled.
  rpc Terminal(stream ProjectTerminalRequest) returns (stream ProjectTerminalReply);
  // Ephemeral login transport. First frame identifies the session profile;
  // subsequent frames carry stdin only. These frames are never journaled.
  // Dedicated auxiliary account login; transient and never journaled.
  rpc AuxiliaryLogin(stream ProjectLoginRequest) returns (stream ProjectLoginOutput);
  rpc SessionLogin(stream ProjectLoginRequest) returns (stream ProjectLoginOutput);
  // Read immediate directory entries inside the project's container as its remote user.
  rpc Paths(ProjectPathsRequest) returns (stream ProjectPathsReply);
  // Stream a regular file as the project remote user; never journal file contents.
  rpc Download(ProjectDownloadRequest) returns (stream ProjectDownloadReply);
  // Start/reuse the project's browser editor. The browser gateway removes the
  // private token from RPC replies and scopes its workbench cookie to the proxy.
  rpc Editor(ProjectEditorRequest) returns (ProjectEditorReply);
  // Private gateway transport to the editor's loopback listener; not web RPC.
  rpc EditorTunnel(stream ProjectEditorTunnelRequest) returns (stream ProjectEditorTunnelReply);
  // A secret file is written by the workspace helper inside a project
  // container, for a client that cannot reach the engine itself. Two calls
  // rather than one with a verb: only one of them carries a secret, and that
  // difference is the whole of what has to be obvious here.
  //
  // Whether the link may carry it at all is decided by the client, because the
  // exposed TCP surface is authenticated plaintext and cannot be told apart
  // from a local socket on this side. See internal/transport.Confidential.
  rpc PutSecretFile(PutSecretFileRequest) returns (SecretFileReply);
  rpc DeleteSecretFile(DeleteSecretFileRequest) returns (SecretFileReply);
  // A project's container, in the three words a person uses about it. Start
  // makes the project run: it builds and creates the container when there is
  // none and starts the one there is otherwise, because "make it run" is one
  // intention either way. Stop keeps the container. Remove throws it away and
  // keeps the project, its sessions, their conversations and its volumes --
  // which is also how a changed configuration gets applied, since starting
  // cannot apply one.
  //
  // None of them creates or resumes a session: that is Session.Add and
  // Session.Resume. These names are what the CLI and the UI show, so a person
  // reading a button knows which call it makes.
  // See docs/plans/project-lifecycle-api.md.
  rpc Start(ProjectStartRequest) returns (Project);
  rpc Stop(ProjectControl) returns (Project);
  rpc Remove(ProjectControl) returns (Project);
}

message ProjectTerminalRequest {
  ProjectRef ref = 1;
  uint32 columns = 2;
  uint32 rows = 3;
  bytes input = 4;
}
message ProjectTerminalReply {
  bool ready = 1;
  bytes output = 2;
  bool exited = 3;
  string error = 4;
}

message ProjectLoginRequest {
  ProjectRef ref = 1;
  AccountRef account = 2;
  string session_key = 3;
  bytes input = 4;
}
message ProjectLoginOutput { bytes output = 1; }

message ProjectPathsRequest { ProjectRef ref = 1; string path = 2; }
// Each reply appends entries; the final reply also reports truncation.
message ProjectPathsReply { repeated ProjectPathEntry entries = 1; bool truncated = 2; }
message ProjectPathEntry {
  string name = 1;
  bool directory = 2;
  bool executable = 3;
  bool symlink = 4;
  string link_target = 5;
  // file, directory, symlink, fifo, socket, block, character, or unknown.
  // Empty on older runtimes; callers can fall back to the boolean metadata.
  string kind = 6;
}

message ProjectStartRequest {
  ProjectRef ref = 1;
  string client_id = 2;
  // Which agent's tools a container gets when this call has to make one. Not a
  // session: nothing here starts one.
  string agent = 3;
  // Consent for a configuration that asks for something dangerous, named by
  // the digest of what the person was shown.
  bool trust_config = 4;
  string config = 5;
}
message ProjectControl { ProjectRef ref = 1; string client_id = 2; }

message ProjectDownloadRequest { ProjectRef ref = 1; string path = 2; }
message ProjectDownloadReply { bytes data = 1; int64 total_size = 2; }

message ProjectEditorRequest { ProjectRef ref = 1; }
message ProjectEditorReply { string workspace = 1; string connection_token = 2; bool simulated = 3; }
message ProjectEditorTunnelRequest { ProjectRef ref = 1; bytes input = 2; }
message ProjectEditorTunnelReply { bool ready = 1; bytes output = 2; }

// session is the runtime id and not a SessionRef: it names the scope the helper
// writes under rather than a row to look up, and this contract cannot refer to
// the session one -- the dependency runs the other way.
message PutSecretFileRequest { ProjectRef ref = 1; string session = 2; bytes secret = 3; }
message DeleteSecretFileRequest { ProjectRef ref = 1; string path = 2; }
message SecretFileReply { string path = 1; }
