edition = "2023";
package cxz;
import "cxz/session.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/lesomnus/cxz/resource";

service SessionService {
  // Read retained conversation statistics, never account billing or lifetime totals.
  rpc ConversationStats(ConversationStatsRequest) returns (ConversationStatsReply);
  rpc Restore(SessionRef) returns (Session);
  rpc Resume(SessionControl) returns (Session);
  rpc Stop(SessionControl) returns (Session);
  rpc Interrupt(SessionControl) returns (SessionReceipt);
  rpc CopyMemory(SessionCopyMemoryRequest) returns (SessionReceipt);
  rpc Library(SessionLibraryRequest) returns (SessionMemoryReply);
  rpc Memory(SessionMemoryRequest) returns (SessionMemoryReply);
  rpc Logs(SessionLogsRequest) returns (SessionLogsReply);
  rpc Permission(SessionPermissionRequest) returns (SessionReceipt);
  rpc Send(SessionSendRequest) returns (SessionReceipt);
  rpc Attach(SessionAttachRequest) returns (SessionAttachment);
  rpc Upload(stream SessionUploadRequest) returns (SessionAttachment);
  rpc Activity(SessionActivityRequest) returns (SessionReceipt);
  rpc UpdateAgent(SessionUpdateRequest) returns (SessionUpdateStatus);
  rpc Reply(SessionReplyRequest) returns (SessionReceipt);
  // Journal replay is not payday Watch: it is cursor-ordered event history.
  rpc History(SessionEventsRequest) returns (SessionEventBatch);
  // Readable, indexed history. Paging counts transcript rows, not protocol records.
  rpc Transcript(SessionTranscriptRequest) returns (SessionTranscriptReply);
  // Full native records for one row/execution, fetched only for inspection.
  rpc EventDetails(SessionEventDetailsRequest) returns (SessionEventBatch);
  rpc Background(SessionBackgroundRequest) returns (SessionBackgroundReply);
  rpc Models(SessionModelsRequest) returns (SessionModelsReply);
  rpc Events(SessionEventsRequest) returns (stream SessionEvent);
  // Search answers across every session in every project, so it names no ref.
  // It is on this service because sessions are what it finds.
  rpc Search(SessionSearchRequest) returns (stream SessionSearchReply);
  // Aux is a model task done beside this session. Asking for one and reading
  // what the last one produced are the same question at two moments, so all
  // four answer with the session's aux state. See docs/plans/aux-api.md.
  rpc AuxRun(AuxRunRequest) returns (AuxState);
  rpc AuxStatus(AuxStatusRequest) returns (AuxState);
  // The same answer, pushed. Relayed from the runtime the way Events is: the
  // controller that runs the tasks is in this process, so there is nothing to
  // poll and nothing to write down in between.
  rpc AuxEvents(AuxStatusRequest) returns (stream AuxState);
  rpc AuxPrefer(AuxPreferRequest) returns (AuxState);
  rpc AuxCancel(AuxCancelRequest) returns (AuxState);
  // Purge destroys a session everywhere cxz keeps it, which is the one
  // operation that does. A dry run reports the plan without carrying it out --
  // the same code, so that what is reported is what would happen.
  rpc Purge(SessionPurgeRequest) returns (SessionPurgeReply);
  // One session's connection to one registered MCP. Both are the session's and
  // not the installation's: the logs are of that launch and the reconnection is
  // of that connection, and neither changes what is registered.
  rpc McpLogs(SessionMcpRequest) returns (SessionMcpLogsReply);
  rpc RestartMcp(SessionMcpRequest) returns (SessionReceipt);
}

// A window is half-open, [since, until), so the windows a client walks back
// through -- a month at a time -- neither overlap nor skip. cursor continues one
// window and carries it, which is what keeps the second page asking the same
// question as the first while new events arrive above it.
//
// The bounds are timestamps rather than the journal's milliseconds because they
// are the caller's, not a journal's: an absent one is no bound at all, which a
// number would have had to spend a value on.
//
// projects and exclude are project runtime ids. A name or an alias is resolved
// where it was displayed: this is not the place to guess which was meant.
message SessionSearchRequest {
  string query = 1;
  string match = 2; // substring (default), regex or fuzzy
  bool ignore_case = 3;
  bool include_tools = 5;
  google.protobuf.Timestamp since = 6;
  google.protobuf.Timestamp until = 7;
  repeated string projects = 8;
  repeated string exclude = 9;
  repeated string sessions = 10;
  int32 limit = 11;
  int32 snippet = 12;
  string cursor = 13;
  string client_id = 14;
}
// One session's results, named once for all of them and newest first -- as the
// visits themselves are.
message SessionSearchVisit {
  string project_id = 1; string project_name = 2;
  string session_id = 3; string alias = 4; string title = 5;
  string agent = 6; string state = 7;
  // Milliseconds, like SessionEvent: these are the journal's own times.
  int64 activity_ms = 8; int64 created_ms = 9;
  // truncated says this session's older events are gone, so finding nothing in
  // it is not evidence that nothing was said.
  bool truncated = 10;
  repeated SessionSearchHit hits = 11;
}
message SessionSearchHit {
  uint64 seq = 1; int64 time_ms = 2; string kind = 3;
  int32 bytes = 4; int32 score = 5; string snippet = 6;
}
// Progress says what the index had to catch up on before answering, or could
// not. A search answers from a derived store, and a store that is behind says so
// rather than return an answer that looks complete.
message SessionSearchProgress {
  string project_id = 1; string project_name = 2;
  string state = 3; // indexed, behind or unavailable
  string message = 4; int32 done = 5; int32 total = 6;
}
// The summary says which window it answered for, because a continued page was
// not told: the window travelled in the cursor, and the client needs it back to
// say what it searched and to ask for the one before it.
message SessionSearchSummary {
  int32 projects = 1; int32 unavailable = 2; int32 sessions = 3;
  int32 hits = 4; int32 truncated = 5;
  string next_cursor = 6; bool has_more = 7;
  google.protobuf.Timestamp since = 8; google.protobuf.Timestamp until = 9;
  // examined is how many messages this page read, which is what the answer
  // cost; pending is how many conversations the index had not caught up with.
  int32 examined = 10; int32 pending = 11;
}
// Exactly one field is set. The summary comes last.
message SessionSearchReply {
  SessionSearchVisit visit = 1;
  SessionSearchProgress progress = 2;
  SessionSearchSummary summary = 3;
}
message SessionControl { SessionRef ref = 1; string run_id = 2; string client_id = 3; }
// cancel takes back the message waiting to be sent, instead of sending text.
message SessionSendRequest { SessionRef ref = 1; string run_id = 2; string client_id = 3; string text = 4; bool cancel = 5; }
message SessionAttachRequest { SessionRef ref = 1; string run_id = 2; bytes content = 3; }
message SessionAttachment { string path = 1; }
// The first message contains the header; subsequent messages contain only bytes.
// Closing the stream completes the upload. No upload IDs or resumable state.
message SessionUploadRequest {
  SessionRef ref = 1; string run_id = 2; string name = 3; int64 size = 4;
  bytes content = 5;
}
message SessionActivityRequest { SessionRef ref = 1; string run_id = 2; string client_id = 3; bool busy = 4; }
message SessionUpdateRequest { SessionRef ref = 1; string run_id = 2; string binary = 3; bool apply = 4; string supervisor_binary = 5; }
message SessionUpdateStatus { bool ready = 1; string reason = 2; string binary = 3; string state = 4; string supervisor_binary = 5; string revision = 6; int32 protocol = 7; }
message SessionReplyRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
  string request_id = 4;
  bool allow = 5;
  string answers_json = 6;
}
message SessionReceipt { string client_id = 1; string status = 2; }
message SessionEventsRequest {
  SessionRef ref = 1; uint64 after_seq = 2; string client_id = 3;
  // History only: zero preserves the legacy page size; bounded by the server.
  uint32 limit = 4;
}
message SessionEventBatch { repeated SessionEvent events = 1; }

// No cursor selects the latest page. after_seq and before_seq are exclusive and
// mutually exclusive. snapshot_seq pins subsequent pages while live events arrive.
message SessionTranscriptRequest {
  SessionRef ref = 1; uint64 after_seq = 2; uint64 before_seq = 3;
  uint32 limit = 4; uint64 snapshot_seq = 5;
}
message SessionTranscriptReply {
  repeated SessionEvent events = 1;
  uint64 snapshot_seq = 2; bool has_older = 3; bool has_newer = 4;
  SessionEvent preceding_input = 5; repeated SessionEvent metadata = 6;
}
message SessionEventDetailsRequest { SessionRef ref = 1; uint64 seq = 2; }

message SessionPermissionRequest { SessionRef ref = 1; string run_id = 2; string client_id = 3; string mode = 4; }

message SessionLogsRequest { SessionRef ref = 1; bool project = 2; }
message SessionLogsReply { string text = 1; }

message SessionMemoryRequest { SessionRef ref = 1; string path = 2; }
message SessionMemoryReply { bytes data = 1; }

message SessionCopyMemoryRequest { SessionRef ref = 1; string path = 2; SessionRef target = 3; string target_path = 4; }

message SessionBackgroundRequest { SessionRef ref = 1; }
message SessionBackgroundReply { uint64 last_seq = 1; bytes data = 2; }
// The model catalog is a projection of the journal, served like background
// state: one request, no event scan. refresh additionally asks the agent, whose
// answer arrives as a journal event.
message SessionModelsRequest { SessionRef ref = 1; bool refresh = 2; string run_id = 3; string client_id = 4; }
message SessionModelsReply {
  uint64 last_seq = 1; bytes data = 2; string run_id = 3;
  uint64 catalog_seq = 4; int64 catalog_ms = 5;
  bool refreshing = 6; string status = 7;
}

message SessionLibraryRequest { SessionRef ref = 1; bytes request = 2; }

// Omit both refs for all listed sessions; refs are mutually exclusive.
// UTC half-open [from_ms, to_ms); defaults to the last 30 days, maximum 366 days.
message ConversationStatsRequest {
  ProjectRef project = 1;
  SessionRef session = 2;
  int64 from_ms = 3;
  int64 to_ms = 4;
}
message ConversationStatsValues {
  uint64 events = 1;
  uint64 input_messages = 2;
  uint64 assistant_events = 3;
  // UTF-8 text bytes of input/assistant events; not a database/disk size.
  uint64 conversation_bytes = 4;
  // UTF-8 text + payload bytes of all events, excluding serialization overhead.
  uint64 event_content_bytes = 5;
  uint64 finished_turns = 6;
  // Uncached input; cache tokens are separate for both Claude and Codex.
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  uint64 cache_read_tokens = 9;
  uint64 cache_write_tokens = 10;
  uint64 token_reported_turns = 11;
  double reported_cost_usd = 12;
  uint64 cost_reported_turns = 13;
}
message ConversationStatsDay {
  string date = 1;
  ConversationStatsValues values = 2;
}
message ConversationStatsCoverage {
  bytes session_id = 1;
  string alias = 2;
  uint64 snapshot_seq = 3;
  uint64 first_seq = 4;
  uint64 last_seq = 5;
  // True only if every seq from 1 through snapshot_seq was observed.
  bool complete = 6;
}
message ConversationStatsReply {
  int64 from_ms = 1;
  int64 to_ms = 2;
  int64 generated_ms = 3;
  ConversationStatsValues total = 4;
  repeated ConversationStatsDay days = 5;
  repeated ConversationStatsCoverage sessions = 6;
  bool complete = 7;
}

// Aux: one task done beside a session.
//
// kinds is what was asked for and results is what came back, so one task can
// answer two kinds -- which is what happens when summary and suggestion share a
// profile and one model call answers both. results may be partial while state
// is still running, because the summary is published while a separate
// suggestion is still being generated.
message Aux {
  string id = 1; bytes session_id = 2;
  repeated AuxKind kinds = 3;
  // The turn this answered. Results are shown beside it.
  string run_id = 4; uint64 turn = 5;
  // The configuration revision it ran under. A changed one makes it stale,
  // because its answer is not an answer for the new settings.
  string revision = 6;
  string state = 7; // queued, running, completed, failed, stale, canceled
  repeated AuxResult results = 8;
  repeated AuxUsage usage = 9;
  string message = 10; // why it failed, for a person to read
}
// truncated says the text hit a limit; what arrived is kept rather than refused.
message AuxResult { AuxKind kind = 1; string text = 2; bool truncated = 3; }
// What this task spent, not what an account has spent.
message AuxUsage { string account = 1; string model = 2; AuxKind kind = 3; bytes data = 4; }
// Kept per turn on the session, so a summary outlives the task that wrote it.
message AuxSummary { string run_id = 1; uint64 turn = 2; string text = 3; }
// Whether a kind runs automatically for this session, overriding the
// installation default. since is read only: turning a kind on does not reach
// backwards over the conversation that already happened.
message AuxPreference { AuxKind kind = 1; bool enabled = 2; google.protobuf.Timestamp since = 3; }
// One session's aux state.
message AuxState {
  repeated AuxSummary summaries = 1;
  Aux current = 2;
  // What ran before, newest first. The current task is the first of them.
  repeated Aux recent = 6;
  repeated AuxPreference preferences = 3;
  // The session's generated title, for the caller that records session names.
  string title = 4;
  string message = 5;
}
// Run asks for one task now. It does not change what runs automatically, and a
// kind that is already automatic is left alone rather than run twice. text is
// only for a title given rather than generated.
message AuxRunRequest { SessionRef ref = 1; repeated AuxKind kinds = 2; string text = 3; }
message AuxStatusRequest { SessionRef ref = 1; uint64 after_turn = 2; int32 limit = 3; }
message AuxPreferRequest { SessionRef ref = 1; repeated AuxPreference preferences = 2; }
message AuxCancelRequest { SessionRef ref = 1; string aux_id = 2; }

message SessionPurgeRequest { SessionRef ref = 1; bool dry_run = 2; }
// kind says what the path is, so a caller can describe a plan without knowing
// the layout: journal, state, cache, and so on.
message SessionPurgeTarget { string kind = 1; string path = 2; int32 files = 3; int64 bytes = 4; }
message SessionPurgeReply {
  SessionRef ref = 1; bool dry_run = 2;
  repeated SessionPurgeTarget targets = 3;
  // retained names what purge deliberately left, so a caller can say so
  // instead of implying the session vanished from the world.
  repeated string retained = 4;
}

message SessionMcpRequest { SessionRef ref = 1; string id = 2; }
// Explicit environment values are removed from the text before it leaves the
// project, because a server that prints its own configuration on startup would
// otherwise hand back the secret it was given.
message SessionMcpLogsReply { string text = 1; string message = 2; }
