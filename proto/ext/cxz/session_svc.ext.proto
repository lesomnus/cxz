edition = "2023";
package cxz;
import "cxz/session.proto";
option go_package = "github.com/lesomnus/cxz/resource";

service SessionService {
  rpc Resume(SessionControl) returns (Session);
  rpc Stop(SessionControl) returns (Session);
  rpc Interrupt(SessionControl) returns (SessionReceipt);
  rpc Logs(SessionLogsRequest) returns (SessionLogsReply);
  rpc Permission(SessionPermissionRequest) returns (SessionReceipt);
  rpc Send(SessionSendRequest) returns (SessionReceipt);
  rpc Attach(SessionAttachRequest) returns (SessionAttachment);
  rpc Activity(SessionActivityRequest) returns (SessionReceipt);
  rpc UpdateAgent(SessionUpdateRequest) returns (SessionUpdateStatus);
  rpc Reply(SessionReplyRequest) returns (SessionReceipt);
  // Journal replay is not payday Watch: it is cursor-ordered event history.
  rpc History(SessionEventsRequest) returns (SessionEventBatch);
  rpc Events(SessionEventsRequest) returns (stream SessionEvent);
}
message SessionControl { SessionRef ref = 1; string run_id = 2; string client_id = 3; }
message SessionSendRequest { SessionRef ref = 1; string run_id = 2; string client_id = 3; string text = 4; }
message SessionAttachRequest { SessionRef ref = 1; string run_id = 2; bytes content = 3; }
message SessionAttachment { string path = 1; }
message SessionActivityRequest { SessionRef ref = 1; string run_id = 2; string client_id = 3; bool busy = 4; }
message SessionUpdateRequest { SessionRef ref = 1; string run_id = 2; string binary = 3; bool apply = 4; }
message SessionUpdateStatus { bool ready = 1; string reason = 2; string binary = 3; string state = 4; }
message SessionReplyRequest {
  SessionRef ref = 1;
  string run_id = 2;
  string client_id = 3;
  string request_id = 4;
  bool allow = 5;
  string answers_json = 6;
}
message SessionReceipt { string client_id = 1; string status = 2; }
message SessionEventsRequest { SessionRef ref = 1; uint64 after_seq = 2; string client_id = 3; }
message SessionEventBatch { repeated SessionEvent events = 1; }

message SessionPermissionRequest { SessionRef ref = 1; string run_id = 2; string client_id = 3; string mode = 4; }

message SessionLogsRequest { SessionRef ref = 1; bool project = 2; }
message SessionLogsReply { string text = 1; }
