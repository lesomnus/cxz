dist:
  module: github.com/lesomnus/cxz/otelcol
  name: cxz-otelcol
  description: cxz managed telemetry collector
  version: 0.1.0
  output_path: .build
  otelcol_version: 0.164.0
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: github.com/lesomnus/cxz/collectorcomponents v0.0.0
    path: ./components
    import: github.com/lesomnus/cxz/collectorcomponents/identityprocessor
    name: identityprocessor
exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.164.1
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
replaces:
  - github.com/lesomnus/cxz => ../identitylib
