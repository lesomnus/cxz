syntax = "proto3";
package cxz.runtime;
option go_package = "github.com/lesomnus/cxz/api;api";

service Sessions {
 rpc Devcontainer(DevcontainerInput) returns (Receipt);
 rpc Docker(DockerInput) returns (Receipt);
  rpc FileMappings(FileMappingsInput) returns (Receipt);
  rpc Create(CreateRequest) returns (Session);
  rpc List(Empty) returns (SessionList);
  rpc Get(SessionRef) returns (Session);
  rpc CopyMemory(CopyMemoryRequest) returns (Receipt);
  rpc Memory(MemoryRequest) returns (MemoryReply);
  rpc Logs(LogsRequest) returns (LogsReply);
  rpc Permission(PermissionInput) returns (Receipt);
  rpc Send(Input) returns (Receipt);
  rpc Attach(AttachmentInput) returns (Attachment);
  rpc Activity(ActivityInput) returns (Receipt);
  rpc UpdateAgent(AgentUpdateInput) returns (AgentUpdateStatus);
  rpc Reply(Answer) returns (Receipt);
  rpc Interrupt(Control) returns (Receipt);
  rpc Resume(Control) returns (Session);
  rpc Stop(Control) returns (Receipt);
  rpc Watch(WatchRequest) returns (stream Event);
  rpc History(WatchRequest) returns (EventBatch);
  rpc Background(SessionRef) returns (BackgroundReply);
  rpc Models(ModelsRequest) returns (ModelsReply);
  rpc Search(SearchRequest) returns (stream SearchReply);
  rpc Open(ProjectRequest) returns (Session);
  rpc Projects(Empty) returns (ProjectList);
  rpc Down(ProjectRequest) returns (Receipt);
}
message Empty {}
message CreateRequest { string workspace = 1; string title = 2; string client_id = 3; string agent = 4; string model = 5; string account = 6; string auth_backend = 7; string auth_binding = 8; }
message SessionRef { string id = 1; }
message Session {
  string id = 1; string workspace = 2; string title = 3; string state = 4;
  string run_id = 5; string vendor_id = 6; int64 created_at = 7; uint64 last_seq = 8;
  repeated Event pending = 9;
  string agent = 10;
  string project_id = 11;
  string model = 12;
  string create_id = 13;
  string project_name = 14;
  string project_alias = 15;
  string account = 16;
  string auth_backend = 17;
  string auth_binding = 18;
  string alias = 19;
  string permission_mode = 20;
  // The one message waiting for an agent that cannot take it yet.
  string queued = 21;
}
message SessionList { repeated Session sessions = 1; }
message Input { string session_id = 1; string run_id = 2; string client_id = 3; string text = 4; bool cancel = 5; }
message AttachmentInput { string session_id = 1; string run_id = 2; bytes content = 3; }
message Attachment { string path = 1; }
message ActivityInput { string session_id = 1; string run_id = 2; string client_id = 3; bool busy = 4; }
message AgentUpdateInput { string session_id = 1; string run_id = 2; string binary = 3; bool apply = 4; string supervisor_binary = 5; }
message AgentUpdateStatus { bool ready = 1; string reason = 2; string binary = 3; string state = 4; string supervisor_binary = 5; string revision = 6; int32 protocol = 7; }
message Answer {
  string session_id = 1; string run_id = 2; string client_id = 3;
  string request_id = 4; bool allow = 5; string answers_json = 6;
}
message Control { string session_id = 1; string run_id = 2; string client_id = 3; }
message Receipt { string client_id = 1; string status = 2; }
message WatchRequest { string session_id = 1; uint64 after_seq = 2; string client_id = 3; }
message Event {
  string session_id = 1; string run_id = 2; uint64 seq = 3; int64 time_ms = 4;
  string kind = 5; string text = 6; string request_id = 7; bytes payload = 8;
  ResponseMetadata response = 9;
}
message ResponseMetadata {
  string model = 1; string effort = 2;
  string model_source = 3; string effort_source = 4; string turn_id = 5;
  string phase = 6; bytes completion_json = 7;
}
message EventBatch { repeated Event events = 1; }
message ProjectRequest {
 string workspace = 1; string agent = 2; string config = 3;
 bool new_session = 4; bool recreate = 5; bool confirmed = 6;
 bool trust_config = 7; string client_id = 8;
 string model = 9;
 bool prepare_only = 10;
 string name = 11;
 string alias = 12;
 string account = 13;
}
message Project {
 string id = 1; string workspace = 2; string name = 3; string state = 4;
 string container_id = 5; string config = 6; string error = 7;
 string remote_user = 8; string remote_workspace = 9;
 string provision_state = 10; string provision_step = 11; uint64 provision_attempt = 12;
 string alias = 13;
}
message ProjectList { repeated Project projects = 1; }

message PermissionInput { string session_id = 1; string run_id = 2; string client_id = 3; string mode = 4; }

message LogsRequest { string session_id = 1; bool project = 2; }
message LogsReply { string text = 1; }

message FileMappingsInput { bytes bundle = 1; }

message DockerInput { string action = 1; bytes spec = 2; }

message MemoryRequest { string session_id = 1; string path = 2; }
message MemoryReply { bytes data = 1; }

message CopyMemoryRequest { string session_id = 1; string path = 2; string target_id = 3; string target_path = 4; }

message BackgroundReply { uint64 last_seq = 1; bytes data = 2; }
// refresh asks the agent for its catalog again. The answer arrives as a journal
// event rather than in this reply: a client already watching the session sees it
// without a second request, and nothing has to block on a provider.
message ModelsRequest { string session_id = 1; bool refresh = 2; string run_id = 3; string client_id = 4; }
message ModelsReply {
  uint64 last_seq = 1; bytes data = 2; string run_id = 3;
  uint64 catalog_seq = 4; int64 catalog_ms = 5;
  bool refreshing = 6; string status = 7;
}

message DevcontainerInput { bytes spec = 1; }

// Search reads conversations rather than sessions, across every project the
// caller's installation holds. A window is half-open, [since_ms, until_ms), so
// consecutive windows -- a month at a time, as the client asks for them --
// neither overlap nor skip, and zero means no bound. cursor continues one
// window; projects and exclude are runtime ids, resolved from names and aliases
// before they get here.
//
// Times here are the journal's milliseconds throughout, because this is the
// runtime's own interface and the journal is what it reads. The wire API takes
// a timestamp for the window, which is the caller's instant rather than a
// recorded one.
message SearchRequest {
  string query = 1; string match = 2; bool ignore_case = 3;
  bool include_tools = 5;
  int64 since_ms = 6; int64 until_ms = 7;
  repeated string projects = 8; repeated string exclude = 9;
  repeated string sessions = 10;
  int32 limit = 11; int32 snippet = 12;
  string cursor = 13; string client_id = 14;
}
// One session's results, named once for all of them. hits are newest first,
// and so are the visits.
message SearchVisit {
  string project_id = 1; string project_name = 2;
  string session_id = 3; string alias = 4; string title = 5;
  string agent = 6; string state = 7;
  int64 activity_ms = 8; int64 created_ms = 9;
  bool truncated = 10;
  repeated SearchHit hits = 11;
}
message SearchHit {
  uint64 seq = 1; int64 time_ms = 2; string kind = 3;
  int32 bytes = 4; int32 score = 5; string snippet = 6;
}
// Progress says what the index had to catch up on, or could not. A search
// answers from a derived store, and a store that is behind has to say so rather
// than return an answer that looks complete.
message SearchProgress {
  string project_id = 1; string project_name = 2; string state = 3;
  string message = 4; int32 done = 5; int32 total = 6;
}
// The summary says which window it answered for, because a continued page was
// not told: the window travelled in the cursor, and the client needs it back to
// say what it searched and to ask for the one before it.
message SearchSummary {
  int32 projects = 1; int32 unavailable = 2; int32 sessions = 3;
  int32 hits = 4; int32 truncated = 5;
  string next_cursor = 6; bool has_more = 7;
  int64 since_ms = 8; int64 until_ms = 9;
  // examined is how many messages this page read, which is the cost of the
  // answer; pending is how many conversations the index had not caught up with.
  int32 examined = 10; int32 pending = 11;
}
// Exactly one field is set. The summary is last.
message SearchReply {
  SearchVisit visit = 1;
  SearchProgress progress = 2;
  SearchSummary summary = 3;
}
