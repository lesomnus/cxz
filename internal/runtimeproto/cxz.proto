syntax = "proto3";
package cxz.runtime;
option go_package = "github.com/lesomnus/cxz/api;api";

service Sessions {
 rpc Devcontainer(DevcontainerInput) returns (Receipt);
  // The shared Docker engine. Five operations, each named, where one message
  // with an action string used to carry all of them -- and a spec field that
  // only two of them could mean anything by.
  rpc SaveEngine(SaveEngineInput) returns (EngineReply);
  rpc StartEngine(StartEngineInput) returns (EngineReply);
  rpc StopEngine(Empty) returns (EngineReply);
  rpc PruneEngine(Empty) returns (EngineReply);
  rpc EngineStatus(Empty) returns (EngineReply);
  rpc GetEngineInfo(Empty) returns (EngineInfo);
  // What this installation of cxz is: its build, its update channel and
  // whether it is pinned. It travelled inside the engine's info reply, which
  // is how a question about Docker came to answer a question about cxz.
  rpc GetInstallationVersion(Empty) returns (InstallationVersion);
  rpc FileMappings(FileMappingsInput) returns (Receipt);
  rpc Create(CreateRequest) returns (Session);
  rpc List(Empty) returns (SessionList);
  rpc Get(SessionRef) returns (Session);
  rpc CopyMemory(CopyMemoryRequest) returns (Receipt);
  rpc Memory(MemoryRequest) returns (MemoryReply);
  rpc Logs(LogsRequest) returns (LogsReply);
  rpc Permission(PermissionInput) returns (Receipt);
  rpc Send(Input) returns (Receipt);
  rpc Attach(AttachmentInput) returns (Attachment);
  rpc Activity(ActivityInput) returns (Receipt);
  rpc UpdateAgent(AgentUpdateInput) returns (AgentUpdateStatus);
  rpc Reply(Answer) returns (Receipt);
  rpc Interrupt(Control) returns (Receipt);
  rpc Resume(Control) returns (Session);
  rpc Stop(Control) returns (Receipt);
  rpc Watch(WatchRequest) returns (stream Event);
  rpc History(WatchRequest) returns (EventBatch);
  rpc Transcript(TranscriptRequest) returns (TranscriptReply);
  rpc EventDetails(EventDetailsRequest) returns (EventBatch);
  rpc Background(SessionRef) returns (BackgroundReply);
  rpc Models(ModelsRequest) returns (ModelsReply);
  rpc Search(SearchRequest) returns (stream SearchReply);
  rpc Open(ProjectRequest) returns (Session);
  rpc Projects(Empty) returns (ProjectList);
  rpc Down(ProjectRequest) returns (Receipt);
  // Aux is a model task attached to a session: run once, with the context cxz
  // assembles, never accumulating into a conversation. Summary, suggestion and
  // title are its kinds. See docs/plans/aux-api.md.
  rpc AuxRun(AuxRunInput) returns (AuxState);
  rpc AuxCancel(AuxCancelInput) returns (AuxState);
  rpc AuxStatus(AuxStatusInput) returns (AuxState);
  // The same answer, pushed. A client that wants to know when a task finishes
  // should not have to ask every second to find out.
  rpc AuxEvents(AuxStatusInput) returns (stream AuxState);
  rpc AuxPrefer(AuxPreferInput) returns (AuxState);
  // Only a session being deleted sends this, which is why the resource API
  // does not carry it.
  rpc AuxForget(AuxForgetInput) returns (Receipt);
  rpc AuxConfig(Empty) returns (AuxConfigReply);
  rpc AuxSetConfig(AuxSetConfigInput) returns (AuxConfigReply);
  rpc AuxModels(AuxModelsInput) returns (AuxModelsReply);
  rpc AuxLoginInfo(AuxLoginInfoInput) returns (AuxLoginInfoReply);
  // A secret file is written by the workspace helper inside a project
  // container, for a client that cannot reach the engine itself. Two calls
  // rather than one with a verb: only one of them carries a secret, and that
  // difference is the whole of what has to be obvious here.
  // Purge destroys a session everywhere cxz keeps it. A dry run reports the
  // same plan without carrying it out, which is the only reason the two share
  // a request instead of being two calls: the plan and the removal must be the
  // same code or the report is of something else.
  rpc PurgeSession(SessionPurgeInput) returns (SessionPurgeReply);
  rpc GetHistoryPolicy(Empty) returns (HistoryPolicy);
  rpc SetHistoryPolicy(HistoryPolicy) returns (HistoryPolicy);
  // The floor a project runtime has trimmed to. Only the manager asks, to keep
  // its cache from offering history the journal no longer has.
  rpc GetHistoryFloor(SessionRef) returns (HistoryFloorReply);
  // Asked before a journal is compacted, not after: it records in the
  // projection that trimmed history is now possible, so a release that predates
  // trimming refuses the database instead of serving history that is gone. A
  // failure here stops the compaction.
  rpc MarkHistoryTrimmable(Empty) returns (Empty);
  rpc PutSecretFile(PutSecretFileInput) returns (SecretFileReply);
  rpc DeleteSecretFile(DeleteSecretFileInput) returns (SecretFileReply);
  // The installation's Agent Skills library, and which projects see each
  // skill. One method per decision rather than one with a verb: enabling a
  // skill by default and enabling it for one project write to different
  // places, and restoring a project's default has nowhere to put an on/off
  // that would be ignored. So no request here can name one and mean another.
  rpc GetSkills(SkillsInput) returns (SkillsReply);
  rpc AddSkill(SkillInput) returns (SkillsReply);
  rpc RemoveSkill(SkillInput) returns (SkillsReply);
  rpc SetSkillDefault(SkillDefaultInput) returns (SkillsReply);
  rpc SetProjectSkill(ProjectSkillInput) returns (SkillsReply);
  rpc ClearProjectSkill(ClearProjectSkillInput) returns (SkillsReply);
  // Manager to project container: the skills this project is allowed to see,
  // already resolved. Resolving before the push is what keeps a library the
  // installation shares from arriving everywhere.
  rpc SyncSkills(SyncSkillsInput) returns (Receipt);
  // What a project actually runs under, read back from what provisioning
  // wrote. Not a second render: a second renderer is a second answer, and the
  // one that is easy to look at is the one that would drift from the one that
  // runs.
  rpc RenderDevcontainer(RenderDevcontainerInput) returns (RenderDevcontainerReply);
  // MCP registrations, and which projects see each one. The same six decisions
  // as the skills library, for the same reason, plus a definition that arrives
  // whole: its environment and headers hold explicit values, so a field-by-
  // field edit would mean reading them back out to change one of them.
  rpc GetMcpServers(McpServersInput) returns (McpServersReply);
  rpc PutMcpServer(PutMcpServerInput) returns (McpServersReply);
  rpc RemoveMcpServer(McpServerInput) returns (McpServersReply);
  rpc SetMcpServerDefault(McpServerDefaultInput) returns (McpServersReply);
  rpc SetProjectMcpServer(ProjectMcpServerInput) returns (McpServersReply);
  rpc ClearProjectMcpServer(ClearProjectMcpServerInput) returns (McpServersReply);
  // What each of a project's live sessions actually launched with, and whether
  // a change is still waiting for a restart. Separate from reading the
  // registrations, because a settings list should not stall on a container.
  rpc McpSessions(McpSessionsInput) returns (McpSessionsReply);
  // Manager to project container: the registrations resolved for this project,
  // for the next agent launch to use.
  rpc SyncMcpServers(SyncMcpServersInput) returns (Receipt);
  // One session's connection to one MCP. Both are the session's, not the
  // installation's: the logs are of that launch and the reconnection is of that
  // connection, and neither touches what is registered.
  rpc McpLogs(McpLogsInput) returns (McpLogsReply);
  rpc RestartMcp(RestartMcpInput) returns (Receipt);
}
message Empty {}
message CreateRequest { string workspace = 1; string title = 2; string client_id = 3; string agent = 4; string model = 5; string account = 6; string auth_backend = 7; string auth_binding = 8; }
message SessionRef { string id = 1; }
message Session {
  string id = 1; string workspace = 2; string title = 3; string state = 4;
  string run_id = 5; string vendor_id = 6; int64 created_at = 7; uint64 last_seq = 8;
  repeated Event pending = 9;
  string agent = 10;
  string project_id = 11;
  string model = 12;
  string create_id = 13;
  string project_name = 14;
  string project_alias = 15;
  string account = 16;
  string auth_backend = 17;
  string auth_binding = 18;
  string alias = 19;
  string permission_mode = 20;
  // The one message waiting for an agent that cannot take it yet.
  string queued = 21;
}
message SessionList { repeated Session sessions = 1; }
message Input { string session_id = 1; string run_id = 2; string client_id = 3; string text = 4; bool cancel = 5; }
message AttachmentInput { string session_id = 1; string run_id = 2; bytes content = 3; }
message Attachment { string path = 1; }
message ActivityInput { string session_id = 1; string run_id = 2; string client_id = 3; bool busy = 4; }
message AgentUpdateInput { string session_id = 1; string run_id = 2; string binary = 3; bool apply = 4; string supervisor_binary = 5; }
message AgentUpdateStatus { bool ready = 1; string reason = 2; string binary = 3; string state = 4; string supervisor_binary = 5; string revision = 6; int32 protocol = 7; }
message Answer {
  string session_id = 1; string run_id = 2; string client_id = 3;
  string request_id = 4; bool allow = 5; string answers_json = 6;
}
message Control { string session_id = 1; string run_id = 2; string client_id = 3; }
message Receipt { string client_id = 1; string status = 2; }
message WatchRequest { string session_id = 1; uint64 after_seq = 2; string client_id = 3; uint32 limit = 4; }
message Event {
  string session_id = 1; string run_id = 2; uint64 seq = 3; int64 time_ms = 4;
  string kind = 5; string text = 6; string request_id = 7; bytes payload = 8;
  ResponseMetadata response = 9;
  ToolSummary tool_summary = 10;
}
message ToolSummary {
  string name = 1; string shell = 2; string command = 3; string state = 4;
  repeated ToolFileSummary files = 5;
  uint32 omitted_files = 6;
}
// Counts describe recorded diff hunks or submitted content/replacement spans.
// An unknown measure never implies zero changes.
message ToolFileSummary {
  string path = 1; string move_path = 2; string action = 3;
  uint32 added = 4; uint32 removed = 5; uint32 lines = 6;
  string measure = 7; bool per_match = 8;
}
message TranscriptRequest { string session_id = 1; uint64 after_seq = 2; uint64 before_seq = 3; uint32 limit = 4; uint64 snapshot_seq = 5; }
message TranscriptReply {
  repeated Event events = 1; uint64 snapshot_seq = 2;
  bool has_older = 3; bool has_newer = 4; Event preceding_input = 5; repeated Event metadata = 6;
}
message EventDetailsRequest { string session_id = 1; uint64 seq = 2; }
message ResponseMetadata {
  string model = 1; string effort = 2;
  string model_source = 3; string effort_source = 4; string turn_id = 5;
  string phase = 6; bytes completion_json = 7;
}
message EventBatch { repeated Event events = 1; }
message ProjectRequest {
 string workspace = 1; string agent = 2; string config = 3;
 bool new_session = 4; bool recreate = 5; bool confirmed = 6;
 bool trust_config = 7; string client_id = 8;
 string model = 9;
 bool prepare_only = 10;
 string name = 11;
 string alias = 12;
 string account = 13;
}
message Project {
 string id = 1; string workspace = 2; string name = 3; string state = 4;
 string container_id = 5; string config = 6; string error = 7;
 string remote_user = 8; string remote_workspace = 9;
 string provision_state = 10; string provision_step = 11; uint64 provision_attempt = 12;
 string alias = 13;
}
message ProjectList { repeated Project projects = 1; }

message PermissionInput { string session_id = 1; string run_id = 2; string client_id = 3; string mode = 4; }

message LogsRequest { string session_id = 1; bool project = 2; }
message LogsReply { string text = 1; }

message FileMappingsInput { bytes bundle = 1; }


message MemoryRequest { string session_id = 1; string path = 2; }
message MemoryReply { bytes data = 1; }

message CopyMemoryRequest { string session_id = 1; string path = 2; string target_id = 3; string target_path = 4; }

message BackgroundReply { uint64 last_seq = 1; bytes data = 2; }
// refresh asks the agent for its catalog again. The answer arrives as a journal
// event rather than in this reply: a client already watching the session sees it
// without a second request, and nothing has to block on a provider.
message ModelsRequest { string session_id = 1; bool refresh = 2; string run_id = 3; string client_id = 4; }
message ModelsReply {
  uint64 last_seq = 1; bytes data = 2; string run_id = 3;
  uint64 catalog_seq = 4; int64 catalog_ms = 5;
  bool refreshing = 6; string status = 7;
}

message DevcontainerInput { bytes spec = 1; }

// Search reads conversations rather than sessions, across every project the
// caller's installation holds. A window is half-open, [since_ms, until_ms), so
// consecutive windows -- a month at a time, as the client asks for them --
// neither overlap nor skip, and zero means no bound. cursor continues one
// window; projects and exclude are runtime ids, resolved from names and aliases
// before they get here.
//
// Times here are the journal's milliseconds throughout, because this is the
// runtime's own interface and the journal is what it reads. The wire API takes
// a timestamp for the window, which is the caller's instant rather than a
// recorded one.
message SearchRequest {
  string query = 1; string match = 2; bool ignore_case = 3;
  bool include_tools = 5;
  int64 since_ms = 6; int64 until_ms = 7;
  repeated string projects = 8; repeated string exclude = 9;
  repeated string sessions = 10;
  int32 limit = 11; int32 snippet = 12;
  string cursor = 13; string client_id = 14;
}
// One session's results, named once for all of them. hits are newest first,
// and so are the visits.
message SearchVisit {
  string project_id = 1; string project_name = 2;
  string session_id = 3; string alias = 4; string title = 5;
  string agent = 6; string state = 7;
  int64 activity_ms = 8; int64 created_ms = 9;
  bool truncated = 10;
  repeated SearchHit hits = 11;
}
message SearchHit {
  uint64 seq = 1; int64 time_ms = 2; string kind = 3;
  int32 bytes = 4; int32 score = 5; string snippet = 6;
}
// Progress says what the index had to catch up on, or could not. A search
// answers from a derived store, and a store that is behind has to say so rather
// than return an answer that looks complete.
message SearchProgress {
  string project_id = 1; string project_name = 2; string state = 3;
  string message = 4; int32 done = 5; int32 total = 6;
}
// The summary says which window it answered for, because a continued page was
// not told: the window travelled in the cursor, and the client needs it back to
// say what it searched and to ask for the one before it.
message SearchSummary {
  int32 projects = 1; int32 unavailable = 2; int32 sessions = 3;
  int32 hits = 4; int32 truncated = 5;
  string next_cursor = 6; bool has_more = 7;
  int64 since_ms = 8; int64 until_ms = 9;
  // examined is how many messages this page read, which is the cost of the
  // answer; pending is how many conversations the index had not caught up with.
  int32 examined = 10; int32 pending = 11;
}
// Exactly one field is set. The summary is last.
message SearchReply {
  SearchVisit visit = 1;
  SearchProgress progress = 2;
  SearchSummary summary = 3;
}

// Aux: one task done beside a session. kinds are strings here, as every other
// kind on this API is; the resource API gives them an enum.
//
// kinds is what was asked for and results is what came back, so one task can
// answer two kinds -- which is what happens when summary and suggestion share a
// profile and one model call answers both. results may be partial while state is
// still running, because the summary is published while a separate suggestion is
// still being generated.
message Aux {
  string id = 1; string session_id = 2;
  repeated string kinds = 3;
  // The turn this answered. Results are shown beside it.
  string run_id = 4; uint64 turn = 5;
  // The configuration revision it ran under. A changed one makes it stale,
  // because its answer is not an answer for the new settings.
  string revision = 6;
  string state = 7; // queued, running, completed, failed, stale, canceled
  repeated AuxResult results = 8;
  repeated AuxUsage usage = 9;
  string message = 10; // why it failed, for a person to read
}
// truncated says the text hit a limit; what arrived is kept rather than refused.
message AuxResult { string kind = 1; string text = 2; bool truncated = 3; }
// What this task spent, not what an account has spent.
message AuxUsage { string account = 1; string model = 2; string kind = 3; bytes data = 4; }
// Kept per turn on the session, so a summary outlives the task that wrote it.
message AuxSummary { string run_id = 1; uint64 turn = 2; string text = 3; }
// Which account and model run a kind. Per kind, because whether two kinds share
// a profile is what decides whether one call can answer both.
// kind is which task this profile runs. agent and backend are read only: they
// come from the registered account, not from a caller.
message AuxProfile {
  string kind = 1; bool enabled = 2; string account = 3; string agent = 4;
  string backend = 5; string model = 6; string effort = 7;
  // Read only: the boundary the server set when the kind was enabled. Sent back
  // so a caller can say what a kind applies to; ignored when it arrives.
  int64 since_ms = 8;
}
// since_ms is the turn boundary: turning a kind on does not reach backwards
// over the conversation that already happened.
message AuxPreference { string kind = 1; bool enabled = 2; int64 since_ms = 3; }
message AuxModel {
  string id = 1; string resolved_id = 2; string name = 3;
  repeated string efforts = 4; string default_effort = 5; bool default = 6;
}
message AuxRunInput { string session_id = 1; repeated string kinds = 2; string text = 3; }
message AuxCancelInput { string session_id = 1; string aux_id = 2; }
message AuxForgetInput { string session_id = 1; }
message AuxStatusInput { string session_id = 1; uint64 after_turn = 2; int32 limit = 3; }
// One session's aux state, which is what every session-scoped call answers
// with: asking for a task and reading what the last one produced are the same
// question asked at two moments, and a caller that just asked wants the answer
// without a second round trip.
message AuxState {
  repeated AuxSummary summaries = 1;
  Aux current = 2;
  // What ran before, newest first. The current task is the first of them.
  repeated Aux recent = 6;
  repeated AuxPreference preferences = 3;
  // The session's generated title, for the caller that records session names.
  string title = 4;
  string message = 5;
}
message AuxPreferInput { string session_id = 1; repeated AuxPreference preferences = 2; }
message AuxConfigReply {
  string revision = 1; repeated AuxProfile profiles = 2;
  string message = 3; string owner = 4;
}
message AuxSetConfigInput { repeated AuxProfile profiles = 1; }
// The account and what it authenticates as, already resolved from the
// registered account by the layer in front of this one.
message AuxModelsInput { string account = 1; string agent = 2; string backend = 3; }
message AuxModelsReply { repeated AuxModel models = 1; bool needs_login = 2; }
message AuxLoginInfoInput { string account = 1; string agent = 2; string backend = 3; }
message AuxLoginInfoReply { string owner = 1; string account = 2; string agent = 3; string backend = 4; }

// The secret travels only on a put, and only over a link that keeps it off the
// network. That decision belongs to the client: the exposed TCP surface is
// authenticated plaintext and cannot be told apart from a local socket here.
message PutSecretFileInput { string project = 1; string session = 2; bytes secret = 3; }
message DeleteSecretFileInput { string project = 1; string path = 2; }
message SecretFileReply { string path = 1; }

message SessionPurgeInput { string session_id = 1; bool dry_run = 2; }
// kind says what the path is, so a caller can describe a plan without knowing
// the layout: journal, state, cache, and so on.
message SessionPurgeTarget { string kind = 1; string path = 2; int32 files = 3; int64 bytes = 4; }
message SessionPurgeReply {
  string session_id = 1; bool dry_run = 2;
  repeated SessionPurgeTarget targets = 3;
  // retained names what purge deliberately left, so a caller can say so
  // instead of implying the session vanished from the world.
  repeated string retained = 4;
}
// disabled turns removal off entirely; zero in a budget means the default. Both
// budgets are per session: see docs/history.md.
message HistoryPolicy {
  bool disabled = 1; int32 max_mib = 2; int32 raw_mib = 3;
  int32 window_mib = 4; int32 window_turns = 5;
}
message HistoryFloorReply { uint64 through = 1; }

// project scopes the view that comes back: with one, each entry says what that
// project sees and whether it decided for itself. Empty is the installation's
// own defaults. A registration is installation-wide either way, so project on
// an add or a remove only chooses whose view is reported back.
message SkillsInput { string project = 1; }
message SkillInput { string project = 1; string name = 2; }
message SkillDefaultInput { string name = 1; bool enabled = 2; }
message ProjectSkillInput { string project = 1; string name = 2; bool enabled = 3; }
message ClearProjectSkillInput { string project = 1; string name = 2; }
message SkillEntry {
  string name = 1; string description = 2;
  // Set only when this project decided for itself; absent means it inherits
  // the installation's default, which is a different thing from agreeing with
  // it.
  optional bool override = 3;
  bool effective = 4;
}
message SkillsReply { repeated SkillEntry entries = 1; string message = 2; }
message SyncSkillsInput { bytes bundle = 1; }

// handle is not a key to a row: it may be a directory inside a workspace
// rather than the workspace itself -- a .devcontainer directory is exactly
// where someone wonders which devcontainer is in effect -- so the manager
// walks up to the registered workspace that owns it. Only a registered
// workspace matches, so walking up cannot widen the answer, and the reply
// names the project it settled on.
message RenderDevcontainerInput { string handle = 1; }
// role is one line of prose, because the order of a merge is what a reader
// needs and what a file name cannot say. source is a path on the manager host.
message RenderedFile { string name = 1; string source = 2; string role = 3; bytes data = 4; }
message RenderDevcontainerReply {
  string project = 1; string name = 2; string workspace = 3;
  // Set when something could not be rendered -- no Compose files to merge, or
  // no Compose CLI to merge them with -- rather than failing the read.
  string note = 4;
  repeated RenderedFile files = 5;
}

// kind is stdio, http or builtin. env and headers hold explicit values and are
// kept private, which is why a definition travels whole: changing one of them
// field by field would mean reading the others back out first.
message McpServer {
  string name = 1; string kind = 2; bool enabled = 3;
  string command = 4; repeated string args = 5; map<string, string> env = 6;
  string url = 7; map<string, string> headers = 8;
}
message McpEntry {
  string id = 1; McpServer server = 2;
  // Set only when this project decided for itself; absent means it inherits.
  optional bool override = 3;
  bool effective = 4;
}
message McpServersReply { repeated McpEntry entries = 1; string message = 2; }
// project scopes the view, as it does for skills. A registration is
// installation-wide, so put and remove have nowhere to name one.
message McpServersInput { string project = 1; }
message PutMcpServerInput { string id = 1; McpServer server = 2; }
message McpServerInput { string id = 1; }
message McpServerDefaultInput { string id = 1; bool enabled = 2; }
message ProjectMcpServerInput { string project = 1; string id = 2; bool enabled = 3; }
message ClearProjectMcpServerInput { string project = 1; string id = 2; }
message McpSessionsInput { string project = 1; }
// servers maps an MCP id to what its connection is doing in this session.
// pending says the session launched with something other than what is
// registered now, so the difference waits for the next launch.
message McpSessionStatus {
  string session_id = 1; string title = 2; bool pending = 3;
  string launch_digest = 4; map<string, string> servers = 5;
}
message McpSessionsReply { repeated McpSessionStatus sessions = 1; string message = 2; }
message SyncMcpServersInput { map<string, McpServer> servers = 1; }
message McpLogsInput { string session_id = 1; string id = 2; }
// Explicit environment values are removed from the text before it leaves the
// project, because a server that prints its own configuration on startup would
// otherwise hand back the secret it was given.
message McpLogsReply { string text = 1; string message = 2; }
message RestartMcpInput { string session_id = 1; string id = 2; }

// mode is off or dind. override is the user's own Compose document and stays
// bytes: it is theirs to write and cxz only merges it.
message EngineSpec { string mode = 1; string image = 2; bytes override = 3; }
// An absent spec on a start means "use the one already saved", which is what an
// empty payload meant. A save has nothing to fall back on, so its spec is
// required.
message SaveEngineInput { EngineSpec spec = 1; }
message StartEngineInput { EngineSpec spec = 1; }
// One line of text for a person: an endpoint, a sentence, or what a prune
// reclaimed.
message EngineReply { string status = 1; }
// What the engine is, and nothing else. The history budgets and the cxz build
// have their own calls.
message EngineInfo {
  string mode = 1; string state = 2; string health = 3;
  string image = 4; string configured_image = 5; string endpoint = 6;
  string build_cache = 7; string reclaimable = 8;
  // Set when the engine is running but its disk usage could not be read,
  // rather than reporting a size of nothing.
  string usage_error = 9;
}
// error is set when the channel or the pin could not be read; the build itself
// is compiled in and always known.
message InstallationVersion {
  string version = 1; string revision = 2; string channel = 3;
  string pin = 4; string error = 5;
}
